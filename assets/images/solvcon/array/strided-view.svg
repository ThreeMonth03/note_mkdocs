<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
  <title id="title">A signed-stride NumPy view represented by one storage span and one descriptor</title>
  <desc id="desc">A four by six buffer is mapped to a four by three reverse step-two view using logical origin 18, shape 4 by 3, and element strides negative 6 and positive 2.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <pattern id="outside" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="3"/>
    </pattern>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 30px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 23px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial; font-size: 19px; font-weight: 600; fill: #475569; }
    .small { font-family: Arial; font-size: 17px; font-weight: 500; fill: #64748b; }
    .mono { font-family: Consolas; font-size: 20px; font-weight: 600; fill: #334155; }
    .cell { font-family: Consolas; font-size: 20px; font-weight: 700; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .axis { font-family: Consolas; font-size: 17px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    .base { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.4; }
    .selected { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.2; }
    .origin { fill: #dbeafe; stroke: #2563eb; stroke-width: 3.2; }
    .view { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  </style>

  <rect width="960" height="690" fill="#ffffff"/>
  <text x="32" y="42" class="heading">buffer + descriptor = strided view</text>
  <text x="32" y="72" class="label">base[::-1, ::2] keeps addresses, not a copied matrix</text>

  <text x="42" y="108" class="section">physical buffer</text>
  <text x="242" y="108" class="small">retained span: offsets 0 ... 22</text>
  <text x="612" y="108" class="section">logical view</text>

  <text x="78" y="126" class="axis">0</text><text x="150" y="126" class="axis">1</text>
  <text x="222" y="126" class="axis">2</text><text x="294" y="126" class="axis">3</text>
  <text x="366" y="126" class="axis">4</text><text x="438" y="126" class="axis">5</text>

  <rect x="42" y="136" width="72" height="52" class="selected"/><rect x="114" y="136" width="72" height="52" class="base"/>
  <rect x="186" y="136" width="72" height="52" class="selected"/><rect x="258" y="136" width="72" height="52" class="base"/>
  <rect x="330" y="136" width="72" height="52" class="selected"/><rect x="402" y="136" width="72" height="52" class="base"/>
  <text x="78" y="162" class="cell">0</text><text x="150" y="162" class="cell">1</text>
  <text x="222" y="162" class="cell">2</text><text x="294" y="162" class="cell">3</text>
  <text x="366" y="162" class="cell">4</text><text x="438" y="162" class="cell">5</text>

  <rect x="42" y="188" width="72" height="52" class="selected"/><rect x="114" y="188" width="72" height="52" class="base"/>
  <rect x="186" y="188" width="72" height="52" class="selected"/><rect x="258" y="188" width="72" height="52" class="base"/>
  <rect x="330" y="188" width="72" height="52" class="selected"/><rect x="402" y="188" width="72" height="52" class="base"/>
  <text x="78" y="214" class="cell">6</text><text x="150" y="214" class="cell">7</text>
  <text x="222" y="214" class="cell">8</text><text x="294" y="214" class="cell">9</text>
  <text x="366" y="214" class="cell">10</text><text x="438" y="214" class="cell">11</text>

  <rect x="42" y="240" width="72" height="52" class="selected"/><rect x="114" y="240" width="72" height="52" class="base"/>
  <rect x="186" y="240" width="72" height="52" class="selected"/><rect x="258" y="240" width="72" height="52" class="base"/>
  <rect x="330" y="240" width="72" height="52" class="selected"/><rect x="402" y="240" width="72" height="52" class="base"/>
  <text x="78" y="266" class="cell">12</text><text x="150" y="266" class="cell">13</text>
  <text x="222" y="266" class="cell">14</text><text x="294" y="266" class="cell">15</text>
  <text x="366" y="266" class="cell">16</text><text x="438" y="266" class="cell">17</text>

  <rect x="42" y="292" width="72" height="52" class="origin"/><rect x="114" y="292" width="72" height="52" class="base"/>
  <rect x="186" y="292" width="72" height="52" class="selected"/><rect x="258" y="292" width="72" height="52" class="base"/>
  <rect x="330" y="292" width="72" height="52" class="selected"/><rect x="402" y="292" width="72" height="52" fill="url(#outside)" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="78" y="318" class="cell">18</text><text x="150" y="318" class="cell">19</text>
  <text x="222" y="318" class="cell">20</text><text x="294" y="318" class="cell">21</text>
  <text x="366" y="318" class="cell">22</text><text x="438" y="318" class="cell">23</text>

  <text x="42" y="371" class="small">orange = selected</text>
  <circle cx="220" cy="365" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="238" y="371" class="small">logical origin</text>
  <rect x="390" y="354" width="18" height="18" fill="url(#outside)" stroke="#94a3b8"/>
  <text x="418" y="371" class="small">outside retained span</text>

  <path d="M505 234 H582" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="544" y="218" class="small" text-anchor="middle">descriptor</text>

  <text x="658" y="127" class="axis">j=0</text><text x="750" y="127" class="axis">j=1</text><text x="842" y="127" class="axis">j=2</text>
  <text x="596" y="163" class="axis">i=0</text><text x="596" y="215" class="axis">i=1</text>
  <text x="596" y="267" class="axis">i=2</text><text x="596" y="319" class="axis">i=3</text>

  <rect x="612" y="136" width="92" height="52" class="origin"/><rect x="704" y="136" width="92" height="52" class="view"/><rect x="796" y="136" width="92" height="52" class="view"/>
  <rect x="612" y="188" width="92" height="52" class="view"/><rect x="704" y="188" width="92" height="52" class="view"/><rect x="796" y="188" width="92" height="52" class="view"/>
  <rect x="612" y="240" width="92" height="52" class="view"/><rect x="704" y="240" width="92" height="52" class="view"/><rect x="796" y="240" width="92" height="52" class="view"/>
  <rect x="612" y="292" width="92" height="52" class="view"/><rect x="704" y="292" width="92" height="52" class="view"/><rect x="796" y="292" width="92" height="52" class="view"/>
  <text x="658" y="162" class="cell">18</text><text x="750" y="162" class="cell">20</text><text x="842" y="162" class="cell">22</text>
  <text x="658" y="214" class="cell">12</text><text x="750" y="214" class="cell">14</text><text x="842" y="214" class="cell">16</text>
  <text x="658" y="266" class="cell">6</text><text x="750" y="266" class="cell">8</text><text x="842" y="266" class="cell">10</text>
  <text x="658" y="318" class="cell">0</text><text x="750" y="318" class="cell">2</text><text x="842" y="318" class="cell">4</text>

  <path d="M658 363 H750" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="704" y="391" class="mono" text-anchor="middle">column step +2</text>
  <path d="M910 162 V214" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="929" y="188" class="mono" text-anchor="middle" transform="rotate(90 929 188)">row step -6</text>

  <rect x="32" y="410" width="896" height="238" rx="10" class="panel"/>
  <text x="54" y="446" class="section">SimpleArray&lt;double&gt; descriptor</text>
  <text x="54" y="483" class="mono">buffer span</text><text x="254" y="483" class="mono">offsets [0, 22] · 184 bytes</text>
  <text x="54" y="518" class="mono">logical origin</text><text x="254" y="518" class="mono">buffer + 18 elements</text>
  <text x="54" y="553" class="mono">shape</text><text x="254" y="553" class="mono">(4, 3)</text>
  <text x="54" y="588" class="mono">stride</text><text x="254" y="588" class="mono">(-6, +2) elements = (-48, +16) bytes</text>
  <line x1="54" y1="607" x2="906" y2="607" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="634" class="mono">address(i,j) = origin + i*(-6) + j*(+2)</text>
  <text x="599" y="634" class="mono">address(1,2) = 16</text>
</svg>
