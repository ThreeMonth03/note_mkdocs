<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">One shared buffer can produce multiple views through origin and signed strides</title>
  <desc id="desc">Contiguous, step-two, and reverse views traverse the same nine-element buffer. Each view stores a logical origin, shape, and signed stride rather than copying elements.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 30px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .body { font: 500 20px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #475569; }
    .label { font: 700 22px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .mono { font: 600 20px Consolas, "Noto Sans Mono", monospace; fill: #334155; }
    .cell-text { font: 700 20px Consolas, "Noto Sans Mono", monospace; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .index { font: 600 18px Consolas, "Noto Sans Mono", monospace; fill: #64748b; text-anchor: middle; }
    .buffer-cell { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .descriptor { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .guide { stroke: #dbe3ee; stroke-width: 1.5; stroke-dasharray: 4 6; }
    .positive { stroke: #2563eb; fill: none; stroke-width: 3; }
    .negative { stroke: #ea580c; fill: none; stroke-width: 3; }
    .point-positive { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .point-negative { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
    .origin-positive { fill: none; stroke: #2563eb; stroke-width: 2; }
    .origin-negative { fill: none; stroke: #ea580c; stroke-width: 2; }
  </style>

  <rect width="960" height="640" fill="#ffffff"/>
  <text x="32" y="42" class="title">同一塊 buffer，用 origin 與 signed stride 形成不同 view</text>
  <text x="32" y="74" class="body">view = buffer + logical origin + shape + signed strides；整個過程不複製 element。</text>

  <text x="32" y="139" class="label">shared buffer</text>
  <text x="270" y="103" class="body">buffer offset</text>
  <g>
    <text x="306" y="116" class="index">0</text><text x="378" y="116" class="index">1</text>
    <text x="450" y="116" class="index">2</text><text x="522" y="116" class="index">3</text>
    <text x="594" y="116" class="index">4</text><text x="666" y="116" class="index">5</text>
    <text x="738" y="116" class="index">6</text><text x="810" y="116" class="index">7</text>
    <text x="882" y="116" class="index">8</text>
    <rect x="270" y="124" width="72" height="56" class="buffer-cell"/><rect x="342" y="124" width="72" height="56" class="buffer-cell"/>
    <rect x="414" y="124" width="72" height="56" class="buffer-cell"/><rect x="486" y="124" width="72" height="56" class="buffer-cell"/>
    <rect x="558" y="124" width="72" height="56" class="buffer-cell"/><rect x="630" y="124" width="72" height="56" class="buffer-cell"/>
    <rect x="702" y="124" width="72" height="56" class="buffer-cell"/><rect x="774" y="124" width="72" height="56" class="buffer-cell"/>
    <rect x="846" y="124" width="72" height="56" class="buffer-cell"/>
    <text x="306" y="153" class="cell-text">a0</text><text x="378" y="153" class="cell-text">a1</text>
    <text x="450" y="153" class="cell-text">a2</text><text x="522" y="153" class="cell-text">a3</text>
    <text x="594" y="153" class="cell-text">a4</text><text x="666" y="153" class="cell-text">a5</text>
    <text x="738" y="153" class="cell-text">a6</text><text x="810" y="153" class="cell-text">a7</text>
    <text x="882" y="153" class="cell-text">a8</text>
  </g>

  <g>
    <line x1="306" y1="180" x2="306" y2="570" class="guide"/><line x1="378" y1="180" x2="378" y2="570" class="guide"/>
    <line x1="450" y1="180" x2="450" y2="570" class="guide"/><line x1="522" y1="180" x2="522" y2="570" class="guide"/>
    <line x1="594" y1="180" x2="594" y2="570" class="guide"/><line x1="666" y1="180" x2="666" y2="570" class="guide"/>
    <line x1="738" y1="180" x2="738" y2="570" class="guide"/><line x1="810" y1="180" x2="810" y2="570" class="guide"/>
    <line x1="882" y1="180" x2="882" y2="570" class="guide"/>
  </g>

  <rect x="32" y="205" width="225" height="104" rx="8" class="descriptor"/>
  <text x="50" y="230" class="label">contiguous view</text>
  <text x="50" y="254" class="mono">origin=0</text>
  <text x="50" y="278" class="mono">shape=(5)</text>
  <text x="50" y="302" class="mono">stride=+1</text>
  <path d="M306 252 H594" class="positive" marker-end="url(#arrow-blue)"/>
  <circle cx="306" cy="252" r="8" class="point-positive"/><circle cx="378" cy="252" r="8" class="point-positive"/>
  <circle cx="450" cy="252" r="8" class="point-positive"/><circle cx="522" cy="252" r="8" class="point-positive"/>
  <circle cx="594" cy="252" r="8" class="point-positive"/><circle cx="306" cy="252" r="14" class="origin-positive"/>
  <text x="306" y="292" class="mono" fill="#2563eb">v = [a0, a1, a2, a3, a4]</text>

  <rect x="32" y="335" width="225" height="104" rx="8" class="descriptor"/>
  <text x="50" y="360" class="label">step-two view</text>
  <text x="50" y="384" class="mono">origin=0</text>
  <text x="50" y="408" class="mono">shape=(5)</text>
  <text x="50" y="432" class="mono">stride=+2</text>
  <path d="M306 382 Q378 334 450 382 Q522 334 594 382 Q666 334 738 382 Q810 334 882 382" class="positive" marker-end="url(#arrow-blue)"/>
  <circle cx="306" cy="382" r="8" class="point-positive"/><circle cx="450" cy="382" r="8" class="point-positive"/>
  <circle cx="594" cy="382" r="8" class="point-positive"/><circle cx="738" cy="382" r="8" class="point-positive"/>
  <circle cx="882" cy="382" r="8" class="point-positive"/><circle cx="306" cy="382" r="14" class="origin-positive"/>
  <text x="306" y="426" class="mono" fill="#2563eb">v = [a0, a2, a4, a6, a8]</text>

  <rect x="32" y="465" width="225" height="104" rx="8" class="descriptor"/>
  <text x="50" y="490" class="label">reverse view</text>
  <text x="50" y="514" class="mono">origin=4</text>
  <text x="50" y="538" class="mono">shape=(5)</text>
  <text x="50" y="562" class="mono">stride=-1</text>
  <path d="M594 512 H306" class="negative" marker-end="url(#arrow-orange)"/>
  <circle cx="594" cy="512" r="8" class="point-negative"/><circle cx="522" cy="512" r="8" class="point-negative"/>
  <circle cx="450" cy="512" r="8" class="point-negative"/><circle cx="378" cy="512" r="8" class="point-negative"/>
  <circle cx="306" cy="512" r="8" class="point-negative"/><circle cx="594" cy="512" r="14" class="origin-negative"/>
  <text x="306" y="556" class="mono" fill="#ea580c">v = [a4, a3, a2, a1, a0]</text>

  <circle cx="44" cy="610" r="8" class="point-positive"/><circle cx="44" cy="610" r="14" class="origin-positive"/>
  <text x="68" y="617" class="body">雙圈是 logical index 0；箭頭是 logical traversal direction。</text>
</svg>
