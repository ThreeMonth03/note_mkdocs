<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Logical array views represented by a buffer, origin, shape, and signed strides</title>
  <desc id="desc">Contiguous, step-two, and reverse views refer to the same kind of storage without copying. Matrix addresses are computed from a logical origin and signed element strides.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .heading { font: 600 25px Inter, "Noto Sans TC", sans-serif; fill: #172033; }
    .sub { font: 500 14px Inter, "Noto Sans TC", sans-serif; fill: #64748b; }
    .label { font: 700 16px Inter, "Noto Sans TC", sans-serif; fill: #172033; }
    .mono { font: 500 16px Inter, ui-monospace, monospace; fill: #334155; }
    .cell-text { font: 600 14px Inter, ui-monospace, monospace; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .index { font: 500 12px Inter, ui-monospace, monospace; fill: #64748b; text-anchor: middle; }
    .cell { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
    .active { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .reverse { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .rule { stroke: #dbe3ee; stroke-width: 1; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="36" y="42" class="heading">A view is an address rule, not a copied array</text>
  <text x="36" y="70" class="mono">logical address = logical_data() + Σ index[axis] × stride[axis]</text>
  <text x="36" y="96" class="sub">Offsets and strides below are measured in elements. data() is the buffer start; logical_data() is logical index zero.</text>

  <line x1="36" y1="119" x2="1164" y2="119" class="rule"/>
  <text x="36" y="151" class="label">contiguous</text>
  <text x="36" y="177" class="mono">shape (5), stride (+1)</text>
  <text x="246" y="145" class="sub">logical index</text>
  <g transform="translate(364 130)">
    <text x="40" y="0" class="index">0</text><text x="120" y="0" class="index">1</text>
    <text x="200" y="0" class="index">2</text><text x="280" y="0" class="index">3</text>
    <text x="360" y="0" class="index">4</text>
    <rect x="0" y="12" width="80" height="54" class="active"/><rect x="80" y="12" width="80" height="54" class="active"/>
    <rect x="160" y="12" width="80" height="54" class="active"/><rect x="240" y="12" width="80" height="54" class="active"/>
    <rect x="320" y="12" width="80" height="54" class="active"/>
    <text x="40" y="39" class="cell-text">a0</text><text x="120" y="39" class="cell-text">a1</text>
    <text x="200" y="39" class="cell-text">a2</text><text x="280" y="39" class="cell-text">a3</text>
    <text x="360" y="39" class="cell-text">a4</text>
    <text x="40" y="84" class="index">data() = logical_data()</text>
  </g>

  <line x1="36" y1="236" x2="1164" y2="236" class="rule"/>
  <text x="36" y="268" class="label">step-two slice</text>
  <text x="36" y="294" class="mono">shape (5), stride (+2)</text>
  <text x="246" y="262" class="sub">logical index maps to buffer offsets 0, 2, 4, 6, 8</text>
  <g transform="translate(364 280)">
    <rect x="0" y="0" width="64" height="54" class="active"/><rect x="64" y="0" width="64" height="54" class="cell"/>
    <rect x="128" y="0" width="64" height="54" class="active"/><rect x="192" y="0" width="64" height="54" class="cell"/>
    <rect x="256" y="0" width="64" height="54" class="active"/><rect x="320" y="0" width="64" height="54" class="cell"/>
    <rect x="384" y="0" width="64" height="54" class="active"/><rect x="448" y="0" width="64" height="54" class="cell"/>
    <rect x="512" y="0" width="64" height="54" class="active"/>
    <text x="32" y="27" class="cell-text">a0</text><text x="96" y="27" class="cell-text">a1</text>
    <text x="160" y="27" class="cell-text">a2</text><text x="224" y="27" class="cell-text">a3</text>
    <text x="288" y="27" class="cell-text">a4</text><text x="352" y="27" class="cell-text">a5</text>
    <text x="416" y="27" class="cell-text">a6</text><text x="480" y="27" class="cell-text">a7</text>
    <text x="544" y="27" class="cell-text">a8</text>
    <path d="M32 76 H160 H288 H416 H544" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="288" y="101" class="index">view traversal; skipped cells remain in the buffer</text>
  </g>

  <line x1="36" y1="405" x2="1164" y2="405" class="rule"/>
  <text x="36" y="437" class="label">reverse view</text>
  <text x="36" y="463" class="mono">shape (5), stride (-1)</text>
  <text x="246" y="431" class="sub">logical index zero starts at the high address</text>
  <g transform="translate(484 431)">
    <rect x="0" y="0" width="80" height="54" class="reverse"/><rect x="80" y="0" width="80" height="54" class="reverse"/>
    <rect x="160" y="0" width="80" height="54" class="reverse"/><rect x="240" y="0" width="80" height="54" class="reverse"/>
    <rect x="320" y="0" width="80" height="54" class="reverse"/>
    <text x="40" y="27" class="cell-text">a0</text><text x="120" y="27" class="cell-text">a1</text>
    <text x="200" y="27" class="cell-text">a2</text><text x="280" y="27" class="cell-text">a3</text>
    <text x="360" y="27" class="cell-text">a4</text>
    <path d="M360 75 H40" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="360" y="-10" class="index">logical_data()</text>
    <text x="40" y="-10" class="index">data()</text>
    <text x="200" y="101" class="index">v[0]=a4, v[1]=a3, …, v[4]=a0</text>
  </g>

  <line x1="36" y1="558" x2="1164" y2="558" class="rule"/>
  <text x="36" y="596" class="label">matrix core addressing</text>
  <text x="265" y="596" class="mono">A(i,k) = lhs_base + i × sA_M + k × sA_K</text>
  <text x="265" y="630" class="mono">B(k,j) = rhs_base + k × sB_K + j × sB_N</text>
  <text x="36" y="671" class="sub">Transpose changes shape and strides; it does not require materializing another buffer.</text>
</svg>
