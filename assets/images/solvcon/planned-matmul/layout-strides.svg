<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
  <title id="title">View descriptors mapped to traversal of one shared buffer</title>
  <desc id="desc">Contiguous, step-two, and reverse views traverse the same buffer using different logical origins and signed strides.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .heading { font: 700 28px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .label { font: 700 22px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .mono { font: 600 21px Consolas, "Noto Sans Mono", monospace; fill: #334155; }
    .cell { font: 700 22px Consolas, "Noto Sans Mono", monospace; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .index { font: 600 19px Consolas, "Noto Sans Mono", monospace; fill: #64748b; text-anchor: middle; }
    .buffer { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .guide { stroke: #dbe3ee; stroke-width: 1.25; stroke-dasharray: 4 5; }
    .positive { fill: none; stroke: #2563eb; stroke-width: 3; }
    .negative { fill: none; stroke: #ea580c; stroke-width: 3; }
    .point-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .point-b { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
  </style>

  <rect width="720" height="510" fill="#ffffff"/>
  <text x="20" y="34" class="heading">view descriptor → buffer traversal</text>
  <text x="72" y="59" class="label">buffer offset</text>

  <g>
    <text x="104" y="76" class="index">0</text><text x="168" y="76" class="index">1</text>
    <text x="232" y="76" class="index">2</text><text x="296" y="76" class="index">3</text>
    <text x="360" y="76" class="index">4</text><text x="424" y="76" class="index">5</text>
    <text x="488" y="76" class="index">6</text><text x="552" y="76" class="index">7</text>
    <text x="616" y="76" class="index">8</text>
    <rect x="72" y="82" width="64" height="48" class="buffer"/><rect x="136" y="82" width="64" height="48" class="buffer"/>
    <rect x="200" y="82" width="64" height="48" class="buffer"/><rect x="264" y="82" width="64" height="48" class="buffer"/>
    <rect x="328" y="82" width="64" height="48" class="buffer"/><rect x="392" y="82" width="64" height="48" class="buffer"/>
    <rect x="456" y="82" width="64" height="48" class="buffer"/><rect x="520" y="82" width="64" height="48" class="buffer"/>
    <rect x="584" y="82" width="64" height="48" class="buffer"/>
    <text x="104" y="106" class="cell">a0</text><text x="168" y="106" class="cell">a1</text>
    <text x="232" y="106" class="cell">a2</text><text x="296" y="106" class="cell">a3</text>
    <text x="360" y="106" class="cell">a4</text><text x="424" y="106" class="cell">a5</text>
    <text x="488" y="106" class="cell">a6</text><text x="552" y="106" class="cell">a7</text>
    <text x="616" y="106" class="cell">a8</text>
  </g>

  <g>
    <line x1="104" y1="130" x2="104" y2="445" class="guide"/><line x1="168" y1="130" x2="168" y2="445" class="guide"/>
    <line x1="232" y1="130" x2="232" y2="445" class="guide"/><line x1="296" y1="130" x2="296" y2="445" class="guide"/>
    <line x1="360" y1="130" x2="360" y2="445" class="guide"/><line x1="424" y1="130" x2="424" y2="445" class="guide"/>
    <line x1="488" y1="130" x2="488" y2="445" class="guide"/><line x1="552" y1="130" x2="552" y2="445" class="guide"/>
    <line x1="616" y1="130" x2="616" y2="445" class="guide"/>
  </g>

  <text x="20" y="170" class="mono"><tspan font-weight="700">contiguous</tspan><tspan>  origin=0 · shape=5 · stride=+1</tspan></text>
  <path d="M104 208 H360" class="positive" marker-end="url(#arrow-blue)"/>
  <circle cx="104" cy="208" r="8" class="point-a"/><circle cx="168" cy="208" r="8" class="point-a"/>
  <circle cx="232" cy="208" r="8" class="point-a"/><circle cx="296" cy="208" r="8" class="point-a"/>
  <circle cx="360" cy="208" r="8" class="point-a"/><circle cx="104" cy="208" r="14" class="positive"/>

  <text x="20" y="280" class="mono"><tspan font-weight="700">step-two</tspan><tspan>   origin=0 · shape=5 · stride=+2</tspan></text>
  <path d="M104 318 Q168 274 232 318 Q296 274 360 318 Q424 274 488 318 Q552 274 616 318" class="positive" marker-end="url(#arrow-blue)"/>
  <circle cx="104" cy="318" r="8" class="point-a"/><circle cx="232" cy="318" r="8" class="point-a"/>
  <circle cx="360" cy="318" r="8" class="point-a"/><circle cx="488" cy="318" r="8" class="point-a"/>
  <circle cx="616" cy="318" r="8" class="point-a"/><circle cx="104" cy="318" r="14" class="positive"/>

  <text x="20" y="390" class="mono"><tspan font-weight="700">reverse</tspan><tspan>    origin=4 · shape=5 · stride=-1</tspan></text>
  <path d="M360 428 H104" class="negative" marker-end="url(#arrow-orange)"/>
  <circle cx="360" cy="428" r="8" class="point-b"/><circle cx="296" cy="428" r="8" class="point-b"/>
  <circle cx="232" cy="428" r="8" class="point-b"/><circle cx="168" cy="428" r="8" class="point-b"/>
  <circle cx="104" cy="428" r="8" class="point-b"/><circle cx="360" cy="428" r="14" class="negative"/>

  <circle cx="32" cy="482" r="7" class="point-a"/><circle cx="32" cy="482" r="12" class="positive"/>
  <text x="54" y="489" class="mono">origin</text>
  <path d="M168 482 H226" class="positive" marker-end="url(#arrow-blue)"/>
  <text x="244" y="489" class="mono">logical order</text>
</svg>
