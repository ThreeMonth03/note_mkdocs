<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pack-once speedup over NumPy by matrix size</title>
  <desc id="desc">For one float64 reversed LHS broadcast to ten matrix products, NumPy time divided by solvcon time is below one at sizes eight and twelve, crosses above one at size sixteen when packing begins, peaks at 2.44 at size thirty-two, and remains above one through size 256.</desc>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 29px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #475569; }
    .axis { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
    .tick { font-family: Consolas, monospace; font-size: 17px; font-weight: 500; fill: #64748b; }
    .callout { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
    .note { font-family: Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #64748b; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .baseline { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .series { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="960" height="540" fill="#ffffff"/>
  <text x="36" y="42" class="title">when one copy starts paying for itself</text>
  <text x="36" y="72" class="subtitle">float64 · lhs (1,S,S), inner stride -1 · rhs (10,S,S), contiguous</text>
  <text x="914" y="72" class="subtitle" text-anchor="end">ratio = NumPy / solvcon</text>

  <rect x="94" y="102" width="820" height="193" fill="#f0fdf4"/>
  <rect x="94" y="295" width="820" height="115" fill="#fff7ed"/>
  <text x="900" y="148" class="axis" fill="#15803d" text-anchor="end">above 1x: solvcon faster</text>
  <text x="900" y="392" class="axis" fill="#c2410c" text-anchor="end">below 1x: NumPy faster</text>

  <line x1="94" y1="353" x2="914" y2="353" class="grid"/>
  <line x1="94" y1="295" x2="914" y2="295" class="baseline"/>
  <line x1="94" y1="237" x2="914" y2="237" class="grid"/>
  <line x1="94" y1="179" x2="914" y2="179" class="grid"/>
  <line x1="94" y1="121" x2="914" y2="121" class="grid"/>

  <text x="78" y="359" class="tick" text-anchor="end">0.5</text>
  <text x="78" y="301" class="tick" text-anchor="end">1.0</text>
  <text x="78" y="243" class="tick" text-anchor="end">1.5</text>
  <text x="78" y="185" class="tick" text-anchor="end">2.0</text>
  <text x="78" y="127" class="tick" text-anchor="end">2.5</text>
  <text x="900" y="320" class="axis" text-anchor="end">same speed</text>

  <polyline points="110,335 220,357 330,242 440,204 550,128 660,173 770,249 880,278" class="series"/>

  <circle cx="110" cy="335" r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="220" cy="357" r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="330" cy="242" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="440" cy="204" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="550" cy="128" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="660" cy="173" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="770" cy="249" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="880" cy="278" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

  <text x="550" y="112" class="callout" text-anchor="middle">2.44x</text>
  <path d="M330 233 V214 H346" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="354" y="222" class="callout">S=16: packing starts</text>

  <text x="110" y="438" class="tick" text-anchor="middle">8</text>
  <text x="220" y="438" class="tick" text-anchor="middle">12</text>
  <text x="330" y="438" class="tick" text-anchor="middle">16</text>
  <text x="440" y="438" class="tick" text-anchor="middle">24</text>
  <text x="550" y="438" class="tick" text-anchor="middle">32</text>
  <text x="660" y="438" class="tick" text-anchor="middle">64</text>
  <text x="770" y="438" class="tick" text-anchor="middle">128</text>
  <text x="880" y="438" class="tick" text-anchor="middle">256</text>
  <text x="504" y="472" class="axis" text-anchor="middle">matrix size S</text>
  <text x="36" y="515" class="note">PR #1256 · native macOS arm64 · NumPy 2.5.1 · Accelerate · 1 BLAS thread</text>
</svg>
