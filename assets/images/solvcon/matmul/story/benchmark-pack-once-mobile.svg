<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">Mobile pack-once benchmark from solvcon pull request 1256</title>
  <desc id="desc">Log-scale execution time for NumPy, the generic parent, and pack-once solvcon on a reused reversed float64 matrix.</desc>
  <style>
    .title { font-family: Arial; font-size: 28px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Consolas; font-size: 18px; font-weight: 500; fill: #475569; }
    .axis { font-family: Arial; font-size: 18px; font-weight: 500; fill: #475569; }
    .label { font-family: Arial; font-size: 19px; font-weight: 700; }
    .note { font-family: Arial; font-size: 19px; font-weight: 500; fill: #334155; }
    .strong { font-family: Arial; font-size: 21px; font-weight: 700; fill: #172033; }
    .grid { stroke: #dbe3ee; stroke-width: 1; }
    .frame { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .threshold { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; }
    .numpy { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; }
    .before { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linejoin: round; }
    .after { fill: none; stroke: #16a34a; stroke-width: 5; stroke-linejoin: round; }
    .dot-n { fill: #fff; stroke: #2563eb; stroke-width: 3; }
    .dot-b { fill: #fff; stroke: #dc2626; stroke-width: 3; }
    .dot-a { fill: #16a34a; stroke: #fff; stroke-width: 2; }
  </style>
  <rect width="640" height="820" fill="#fff"/>
  <text x="24" y="40" class="title">One reversed matrix, reused ×10</text>
  <text x="24" y="75" class="subtitle">lhs (1,S,S), strides (S²,S,-1)</text>
  <text x="24" y="103" class="subtitle">rhs (10,S,S), C-contiguous · float64</text>

  <g class="grid">
    <line x1="78" y1="150" x2="610" y2="150"/><line x1="78" y1="210" x2="610" y2="210"/><line x1="78" y1="270" x2="610" y2="270"/><line x1="78" y1="330" x2="610" y2="330"/><line x1="78" y1="390" x2="610" y2="390"/><line x1="78" y1="450" x2="610" y2="450"/><line x1="78" y1="510" x2="610" y2="510"/>
  </g>
  <rect x="78" y="150" width="532" height="360" class="frame"/>
  <g class="axis" text-anchor="end">
    <text x="68" y="156">1000</text><text x="68" y="216">100</text><text x="68" y="276">10</text><text x="68" y="336">1</text><text x="68" y="396">.1</text><text x="68" y="456">.01</text><text x="68" y="516">.001</text>
  </g>
  <line x1="199" y1="150" x2="199" y2="510" class="threshold"/>
  <text x="208" y="174" class="label" fill="#7c3aed">pack once ≥16</text>

  <polyline points="100,481 169,464 238,459 307,438 376,426 445,396 514,359 583,310" class="numpy"/>
  <polyline points="100,470 169,443 238,424 307,394 376,368 445,305 514,242 583,181" class="before"/>
  <polyline points="100,470 169,443 238,468 307,453 376,449 445,415 514,368 583,314" class="after"/>
  <g>
    <circle cx="100" cy="481" r="5" class="dot-n"/><circle cx="169" cy="464" r="5" class="dot-n"/><circle cx="238" cy="459" r="5" class="dot-n"/><circle cx="307" cy="438" r="5" class="dot-n"/><circle cx="376" cy="426" r="5" class="dot-n"/><circle cx="445" cy="396" r="5" class="dot-n"/><circle cx="514" cy="359" r="5" class="dot-n"/><circle cx="583" cy="310" r="5" class="dot-n"/>
    <circle cx="100" cy="470" r="5" class="dot-b"/><circle cx="169" cy="443" r="5" class="dot-b"/><circle cx="238" cy="424" r="5" class="dot-b"/><circle cx="307" cy="394" r="5" class="dot-b"/><circle cx="376" cy="368" r="5" class="dot-b"/><circle cx="445" cy="305" r="5" class="dot-b"/><circle cx="514" cy="242" r="5" class="dot-b"/><circle cx="583" cy="181" r="5" class="dot-b"/>
    <circle cx="100" cy="470" r="6" class="dot-a"/><circle cx="169" cy="443" r="6" class="dot-a"/><circle cx="238" cy="468" r="6" class="dot-a"/><circle cx="307" cy="453" r="6" class="dot-a"/><circle cx="376" cy="449" r="6" class="dot-a"/><circle cx="445" cy="415" r="6" class="dot-a"/><circle cx="514" cy="368" r="6" class="dot-a"/><circle cx="583" cy="314" r="6" class="dot-a"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="100" y="538">8</text><text x="169" y="538">12</text><text x="238" y="538">16</text><text x="307" y="538">24</text><text x="376" y="538">32</text><text x="445" y="538">64</text><text x="514" y="538">128</text><text x="583" y="538">256</text>
  </g>
  <text x="344" y="566" class="axis" text-anchor="middle">matrix side S · ms/call log scale</text>

  <line x1="24" y1="604" x2="62" y2="604" class="before"/><text x="72" y="611" class="label" fill="#dc2626">parent generic</text>
  <line x1="250" y1="604" x2="288" y2="604" class="numpy"/><text x="298" y="611" class="label" fill="#2563eb">NumPy</text>
  <line x1="442" y1="604" x2="480" y2="604" class="after"/><text x="490" y="611" class="label" fill="#16a34a">pack once</text>

  <text x="24" y="660" class="strong">S=32 · 0.0100 vs 0.0244 ms · 2.44×</text>
  <text x="24" y="698" class="note">S ≥ 16: all 72 affected points beat NumPy</text>
  <text x="24" y="730" class="note">range 1.11×–2.97× · PR #1256</text>
  <text x="24" y="774" class="axis">macOS arm64 · NumPy 2.5.1 · Accelerate · 1 thread</text>
</svg>
