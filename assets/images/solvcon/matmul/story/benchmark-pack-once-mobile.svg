<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
  <title id="title">Pack-once speedup over NumPy by matrix size</title>
  <desc id="desc">For one float64 reversed LHS broadcast to ten matrix products, NumPy time divided by solvcon time is below one at sizes eight and twelve, crosses above one at size sixteen when packing begins, peaks at 2.44 at size thirty-two, and remains above one through size 256.</desc>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #475569; }
    .axis { font-family: Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #475569; }
    .tick { font-family: Consolas, monospace; font-size: 21px; font-weight: 500; fill: #64748b; }
    .callout { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; }
    .note { font-family: Arial, sans-serif; font-size: 21px; font-weight: 500; fill: #64748b; }
    .grid { stroke: #cbd5e1; stroke-width: 1.5; }
    .baseline { stroke: #334155; stroke-width: 3; stroke-dasharray: 9 7; }
    .series { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="640" height="790" fill="#ffffff"/>
  <text x="24" y="42" class="title">when one copy pays off</text>
  <text x="24" y="79" class="subtitle">float64 · reversed LHS reused 10 times</text>
  <text x="24" y="111" class="subtitle">NumPy time / solvcon time</text>

  <rect x="80" y="148" width="536" height="270" fill="#f0fdf4"/>
  <rect x="80" y="418" width="536" height="162" fill="#fff7ed"/>
  <text x="96" y="179" class="axis" fill="#15803d">solvcon faster</text>
  <text x="96" y="558" class="axis" fill="#c2410c">NumPy faster</text>

  <line x1="80" y1="499" x2="616" y2="499" class="grid"/>
  <line x1="80" y1="418" x2="616" y2="418" class="baseline"/>
  <line x1="80" y1="337" x2="616" y2="337" class="grid"/>
  <line x1="80" y1="256" x2="616" y2="256" class="grid"/>
  <line x1="80" y1="175" x2="616" y2="175" class="grid"/>
  <text x="66" y="506" class="tick" text-anchor="end">0.5</text>
  <text x="66" y="425" class="tick" text-anchor="end">1.0</text>
  <text x="66" y="344" class="tick" text-anchor="end">1.5</text>
  <text x="66" y="263" class="tick" text-anchor="end">2.0</text>
  <text x="66" y="182" class="tick" text-anchor="end">2.5</text>

  <polyline points="94,475 166,506 238,344 310,273 382,175 454,245 526,353 598,394" class="series"/>
  <circle cx="94" cy="475" r="8" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <circle cx="166" cy="506" r="8" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <circle cx="238" cy="344" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="310" cy="273" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="382" cy="175" r="9" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="454" cy="245" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="526" cy="353" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="598" cy="394" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>

  <text x="382" y="157" class="callout" text-anchor="middle">2.44x</text>
  <path d="M238 333 V298 H273" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="280" y="291" class="callout">packing starts</text>

  <text x="94" y="615" class="tick" text-anchor="middle">8</text>
  <text x="166" y="615" class="tick" text-anchor="middle">12</text>
  <text x="238" y="615" class="tick" text-anchor="middle">16</text>
  <text x="310" y="615" class="tick" text-anchor="middle">24</text>
  <text x="382" y="615" class="tick" text-anchor="middle">32</text>
  <text x="454" y="615" class="tick" text-anchor="middle">64</text>
  <text x="526" y="615" class="tick" text-anchor="middle">128</text>
  <text x="598" y="615" class="tick" text-anchor="middle">256</text>
  <text x="348" y="654" class="axis" text-anchor="middle">matrix size S</text>

  <text x="24" y="708" class="note">PR #1256 · native macOS arm64</text>
  <text x="24" y="738" class="note">NumPy 2.5.1 · Accelerate · 1 thread</text>
  <text x="24" y="768" class="note">below 1x: NumPy is faster</text>
</svg>
