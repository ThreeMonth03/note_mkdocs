<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Batch coordinates mapped to reused operand bases</title>
  <desc id="desc">A two-by-one lhs batch and one-by-five rhs batch map to a two-by-five output batch. Lhs bases repeat across columns and rhs bases repeat across rows.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .heading { font: 700 28px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .label { font: 700 23px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .mono { font: 600 22px Consolas, "Noto Sans Mono", monospace; fill: #334155; }
    .cell { font: 700 21px Consolas, "Noto Sans Mono", monospace; text-anchor: middle; dominant-baseline: middle; }
    .axis { font: 600 20px Consolas, "Noto Sans Mono", monospace; fill: #475569; text-anchor: middle; }
    .a { fill: #2563eb; }
    .b { fill: #ea580c; }
    .c { fill: #16a34a; }
    .a-fill { fill: #eff6ff; }
    .b-fill { fill: #fff7ed; }
    .grid { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .selected { fill: none; stroke: #16a34a; stroke-width: 4; }
  </style>

  <rect width="720" height="420" fill="#ffffff"/>
  <text x="20" y="34" class="heading">batch coordinate → base offsets</text>

  <text x="20" y="72" class="label a">lhs (2,1)</text>
  <rect x="132" y="48" width="76" height="38" rx="5" class="a-fill" stroke="#2563eb" stroke-width="2"/>
  <rect x="132" y="90" width="76" height="38" rx="5" class="a-fill" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="68" class="cell a">L0</text>
  <text x="170" y="110" class="cell a">L12</text>
  <text x="230" y="69" class="axis">b0=0</text>
  <text x="230" y="111" class="axis">b0=1</text>

  <text x="292" y="72" class="label b">rhs (1,5)</text>
  <g transform="translate(292 88)">
    <rect x="0" y="0" width="78" height="40" rx="5" class="b-fill" stroke="#ea580c" stroke-width="2"/>
    <rect x="82" y="0" width="78" height="40" rx="5" class="b-fill" stroke="#ea580c" stroke-width="2"/>
    <rect x="164" y="0" width="78" height="40" rx="5" class="b-fill" stroke="#ea580c" stroke-width="2"/>
    <rect x="246" y="0" width="78" height="40" rx="5" class="b-fill" stroke="#ea580c" stroke-width="2"/>
    <rect x="328" y="0" width="78" height="40" rx="5" class="b-fill" stroke="#ea580c" stroke-width="2"/>
    <text x="39" y="21" class="cell b">R0</text><text x="121" y="21" class="cell b">R24</text>
    <text x="203" y="21" class="cell b">R48</text><text x="285" y="21" class="cell b">R72</text>
    <text x="367" y="21" class="cell b">R96</text>
  </g>

  <text x="20" y="174" class="label c">output batch (2,5)</text>
  <text x="124" y="202" class="axis">b1=0</text><text x="236" y="202" class="axis">b1=1</text>
  <text x="348" y="202" class="axis">b1=2</text><text x="460" y="202" class="axis">b1=3</text>
  <text x="572" y="202" class="axis">b1=4</text>
  <text x="32" y="245" class="axis">b0=0</text><text x="32" y="297" class="axis">b0=1</text>

  <g transform="translate(68 212)">
    <g transform="translate(0 0)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L0</text><text x="56" y="39" class="cell b">R0</text></g>
    <g transform="translate(112 0)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L0</text><text x="56" y="39" class="cell b">R24</text></g>
    <g transform="translate(224 0)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L0</text><text x="56" y="39" class="cell b">R48</text></g>
    <g transform="translate(336 0)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L0</text><text x="56" y="39" class="cell b">R72</text></g>
    <g transform="translate(448 0)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L0</text><text x="56" y="39" class="cell b">R96</text></g>
    <g transform="translate(0 52)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L12</text><text x="56" y="39" class="cell b">R0</text></g>
    <g transform="translate(112 52)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L12</text><text x="56" y="39" class="cell b">R24</text></g>
    <g transform="translate(224 52)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L12</text><text x="56" y="39" class="cell b">R48</text></g>
    <g transform="translate(336 52)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L12</text><text x="56" y="39" class="cell b">R72</text><rect x="2" y="2" width="108" height="48" rx="3" class="selected"/></g>
    <g transform="translate(448 52)"><rect width="112" height="52" class="grid"/><rect x="2" y="2" width="108" height="23" class="a-fill"/><rect x="2" y="27" width="108" height="23" class="b-fill"/><text x="56" y="14" class="cell a">L12</text><text x="56" y="39" class="cell b">R96</text></g>
  </g>

  <path d="M82 210 H616" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="92" y="344" class="mono a">Δb1: lhs +0</text>
  <path d="M648 220 V306" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="438" y="344" class="mono b">Δb0: rhs +0</text>

  <line x1="20" y1="365" x2="700" y2="365" stroke="#dbe3ee" stroke-width="1.5"/>
  <text x="20" y="400" class="mono"><tspan class="c">(1,3)</tspan><tspan> → </tspan><tspan class="c">out 144</tspan><tspan> · </tspan><tspan class="a">lhs 12</tspan><tspan> · </tspan><tspan class="b">rhs 72</tspan></text>
</svg>
