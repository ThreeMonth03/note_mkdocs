<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" role="img" aria-labelledby="title desc">
  <title id="title">Exact address trace for one batched matrix-multiplication output</title>
  <desc id="desc">For A shape 2 by 1 by 3 by 4 and B shape 1 by 5 by 4 by 6, the output coordinate 1, 3, 2, 4 reads A offsets 20 through 23 and B offsets 76, 82, 88, and 94, then accumulates into C offset 160.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial, sans-serif; font-size: 29px; font-weight: 700; fill: #172033; }
    .shape { font-family: Consolas, monospace; font-size: 23px; font-weight: 600; fill: #334155; }
    .section { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #475569; }
    .mono-a { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1d4ed8; }
    .mono-b { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #c2410c; }
    .mono-c { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #15803d; }
    .table-head { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .table-a { font-family: Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; dominant-baseline: middle; }
    .table-b { font-family: Consolas, monospace; font-size: 24px; font-weight: 700; fill: #c2410c; text-anchor: middle; dominant-baseline: middle; }
    .rule { stroke: #cbd5e1; stroke-width: 2; }
    .guide { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .sum { fill: none; stroke: #15803d; stroke-width: 3.5; marker-end: url(#arrow-green); }
    .a-fill { fill: #eff6ff; }
    .b-fill { fill: #fff7ed; }
    .c-fill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
  </style>

  <rect width="640" height="980" fill="#ffffff"/>
  <text x="24" y="38" class="heading">one element -&gt; exact offsets</text>
  <text x="24" y="78" class="shape" fill="#1d4ed8">A(2,1,3,4)</text>
  <text x="183" y="78" class="shape" fill="#64748b">@</text>
  <text x="216" y="78" class="shape" fill="#c2410c">B(1,5,4,6)</text>
  <text x="24" y="111" class="shape" fill="#64748b">-&gt;</text>
  <text x="70" y="111" class="shape" fill="#15803d">C(2,5,3,6)</text>
  <line x1="24" y1="130" x2="616" y2="130" class="rule"/>

  <text x="24" y="170" class="section">1  Batch  b=(1,3)</text>
  <text x="24" y="211" class="mono-a">A: 1*12 + 3*0 = 12</text>
  <text x="24" y="240" class="label">second axis broadcasts</text>
  <text x="24" y="282" class="mono-b">B: 1*0 + 3*24 = 72</text>
  <text x="24" y="311" class="label">first axis broadcasts</text>
  <text x="24" y="353" class="mono-c">C: 1*90 + 3*18 = 144</text>
  <text x="24" y="382" class="label">start of output matrix</text>
  <path d="M320 397 V427" class="guide"/>

  <text x="24" y="461" class="section">2  Core  (i,j)=(2,4)</text>
  <rect x="24" y="481" width="592" height="52" class="a-fill"/>
  <rect x="24" y="543" width="592" height="52" class="b-fill"/>
  <rect x="24" y="605" width="592" height="52" class="c-fill"/>
  <text x="42" y="515" class="mono-a">A base: 12 + 2*4 = 20</text>
  <text x="42" y="577" class="mono-b">B base: 72 + 4 = 76</text>
  <text x="42" y="639" class="mono-c">C address: 144 + 2*6 + 4 = 160</text>
  <path d="M320 658 V686" class="guide"/>

  <text x="24" y="721" class="section">3  Contract  k=0..3</text>
  <line x1="24" y1="740" x2="616" y2="740" class="rule"/>
  <line x1="24" y1="790" x2="616" y2="790" class="rule"/>
  <line x1="24" y1="847" x2="616" y2="847" class="rule"/>
  <line x1="24" y1="904" x2="616" y2="904" class="rule"/>
  <line x1="166" y1="740" x2="166" y2="904" class="rule"/>
  <line x1="278" y1="740" x2="278" y2="904" class="rule"/>
  <line x1="390" y1="740" x2="390" y2="904" class="rule"/>
  <line x1="502" y1="740" x2="502" y2="904" class="rule"/>
  <line x1="616" y1="740" x2="616" y2="904" class="rule"/>
  <text x="95" y="765" class="table-head">k</text>
  <text x="222" y="765" class="table-head">0</text>
  <text x="334" y="765" class="table-head">1</text>
  <text x="446" y="765" class="table-head">2</text>
  <text x="559" y="765" class="table-head">3</text>
  <rect x="24" y="790" width="592" height="57" class="a-fill"/>
  <rect x="24" y="847" width="592" height="57" class="b-fill"/>
  <text x="95" y="819" class="table-a">A off</text>
  <text x="222" y="819" class="table-a">20</text>
  <text x="334" y="819" class="table-a">21</text>
  <text x="446" y="819" class="table-a">22</text>
  <text x="559" y="819" class="table-a">23</text>
  <text x="95" y="876" class="table-b">B off</text>
  <text x="222" y="876" class="table-b">76</text>
  <text x="334" y="876" class="table-b">82</text>
  <text x="446" y="876" class="table-b">88</text>
  <text x="559" y="876" class="table-b">94</text>
  <text x="250" y="950" class="mono-c">sum</text>
  <rect x="326" y="920" width="208" height="48" rx="5" class="c-fill"/>
  <text x="430" y="944" class="table-head" fill="#15803d">C[160]</text>
  <path d="M566 884 V944 H540" class="sum"/>
</svg>
