<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Broadcast reuse and a negative-stride contraction</title>
  <desc id="desc">For a reversed A view broadcast across two B matrices, batch coordinate one keeps A at base zero and moves B to base twelve. Output C at batch one row two column one reads A offsets eight, seven, six, five and B offsets thirteen, sixteen, nineteen, twenty-two.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 22px; font-weight: 600; fill: #334155; }
    .mono-a { font-family: Consolas, monospace; font-size: 23px; font-weight: 700; fill: #1d4ed8; }
    .mono-b { font-family: Consolas, monospace; font-size: 23px; font-weight: 700; fill: #c2410c; }
    .mono-c { font-family: Consolas, monospace; font-size: 23px; font-weight: 700; fill: #15803d; }
    .cell { font-family: Consolas, monospace; font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .walk-a { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
    .walk-b { fill: none; stroke: #ea580c; stroke-width: 4; marker-end: url(#arrow-orange); }
  </style>

  <rect width="640" height="900" fill="#ffffff"/>
  <text x="24" y="42" class="heading">broadcast reuse + reverse walk</text>

  <rect x="24" y="70" width="592" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="44" y="104" class="mono-a">A view  (1,4,4)</text>
  <text x="44" y="136" class="mono">batch (0)  core (4,-1)</text>
  <rect x="24" y="166" width="592" height="82" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="200" class="mono-b">B  (2,4,3)</text>
  <text x="44" y="232" class="mono">batch (12)  core (3,1)</text>

  <text x="24" y="294" class="section">1  Batch b=1</text>
  <text x="24" y="334" class="mono-a">A base = 1*0 = 0</text>
  <text x="330" y="334" class="label">reused</text>
  <text x="24" y="372" class="mono-b">B base = 1*12 = 12</text>
  <text x="330" y="372" class="mono-c">C base = 12</text>

  <text x="24" y="432" class="section">2  Core (i,j)=(2,1)</text>
  <rect x="24" y="452" width="592" height="58" rx="6" fill="#eff6ff"/>
  <rect x="24" y="520" width="592" height="58" rx="6" fill="#fff7ed"/>
  <rect x="24" y="588" width="592" height="58" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="44" y="489" class="mono-a">A row: 0 + 2*4 = 8</text>
  <text x="44" y="557" class="mono-b">B col: 12 + 1 = 13</text>
  <text x="44" y="625" class="mono-c">C[1,2,1] = C[19]</text>

  <text x="24" y="700" class="section">3  K contraction</text>
  <text x="24" y="738" class="label">A follows stride -1; B follows stride +3</text>

  <rect x="52" y="760" width="66" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="118" y="760" width="66" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="184" y="760" width="66" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="250" y="760" width="66" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="85" y="787" class="cell" fill="#1d4ed8">5</text>
  <text x="151" y="787" class="cell" fill="#1d4ed8">6</text>
  <text x="217" y="787" class="cell" fill="#1d4ed8">7</text>
  <text x="283" y="787" class="cell" fill="#1d4ed8">8</text>
  <path d="M283 830 H85" class="walk-a"/>

  <rect x="340" y="760" width="66" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="406" y="760" width="66" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="472" y="760" width="66" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="538" y="760" width="66" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <text x="373" y="787" class="cell" fill="#c2410c">13</text>
  <text x="439" y="787" class="cell" fill="#c2410c">16</text>
  <text x="505" y="787" class="cell" fill="#c2410c">19</text>
  <text x="571" y="787" class="cell" fill="#c2410c">22</text>
  <path d="M373 830 H571" class="walk-b"/>

  <text x="68" y="878" class="mono-a">8 -> 7 -> 6 -> 5</text>
  <text x="338" y="878" class="mono-b">13 -> 16 -> 19 -> 22</text>
</svg>
