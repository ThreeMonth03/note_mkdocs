<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Public matmul roles normalized to one core contraction</title>
  <desc id="desc">DOT, GEVM, GEMV, and GEMM transform into A M by K times B K by N. Dashed length-one axes are synthetic.</desc>
  <style>
    .heading { font: 700 28px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #172033; }
    .column { font: 600 22px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; fill: #64748b; }
    .role { font: 700 24px Consolas, "Noto Sans Mono", monospace; fill: #172033; }
    .shape { font: 600 23px Consolas, "Noto Sans Mono", monospace; fill: #334155; }
    .core { font: 700 24px Consolas, "Noto Sans Mono", monospace; text-anchor: middle; dominant-baseline: middle; }
    .output { font: 700 24px Consolas, "Noto Sans Mono", monospace; fill: #16a34a; dominant-baseline: middle; }
    .operand-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .operand-b { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .synthetic { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 5 4; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
    .a { fill: #2563eb; }
    .b { fill: #ea580c; }
    .c { fill: #16a34a; }
    .k { fill: #7c3aed; }
  </style>

  <rect width="720" height="430" fill="#ffffff"/>
  <text x="20" y="34" class="heading">public role → normalized core</text>
  <text x="20" y="68" class="column">role</text>
  <text x="112" y="68" class="column">public operands</text>
  <text x="318" y="68" class="column">executor core</text>
  <text x="606" y="68" class="column">output</text>
  <line x1="20" y1="78" x2="700" y2="78" class="rule"/>

  <g transform="translate(0 84)">
    <text x="20" y="31" class="role">DOT</text>
    <text x="112" y="31" class="shape">K @ K</text>
    <text x="282" y="31" class="shape">→</text>
    <rect x="318" y="7" width="112" height="46" rx="5" class="operand-a"/>
    <rect x="462" y="7" width="112" height="46" rx="5" class="operand-b"/>
    <rect x="328" y="14" width="27" height="32" rx="4" class="synthetic"/>
    <rect x="537" y="14" width="27" height="32" rx="4" class="synthetic"/>
    <text x="341" y="31" class="core a">1</text><text x="367" y="31" class="core a">×</text><text x="397" y="31" class="core k">K</text>
    <text x="446" y="31" class="role" text-anchor="middle">@</text>
    <text x="489" y="31" class="core k">K</text><text x="518" y="31" class="core b">×</text><text x="550" y="31" class="core b">1</text>
    <text x="606" y="31" class="output">C[1]</text>
  </g>
  <line x1="20" y1="144" x2="700" y2="144" class="rule"/>

  <g transform="translate(0 150)">
    <text x="20" y="31" class="role">GEVM</text>
    <text x="112" y="31" class="shape">K @ K×N</text>
    <text x="282" y="31" class="shape">→</text>
    <rect x="318" y="7" width="112" height="46" rx="5" class="operand-a"/>
    <rect x="462" y="7" width="112" height="46" rx="5" class="operand-b"/>
    <rect x="328" y="14" width="27" height="32" rx="4" class="synthetic"/>
    <text x="341" y="31" class="core a">1</text><text x="367" y="31" class="core a">×</text><text x="397" y="31" class="core k">K</text>
    <text x="446" y="31" class="role" text-anchor="middle">@</text>
    <text x="489" y="31" class="core k">K</text><text x="518" y="31" class="core b">×</text><text x="550" y="31" class="core b">N</text>
    <text x="606" y="31" class="output">C[N]</text>
  </g>
  <line x1="20" y1="210" x2="700" y2="210" class="rule"/>

  <g transform="translate(0 216)">
    <text x="20" y="31" class="role">GEMV</text>
    <text x="112" y="31" class="shape">M×K @ K</text>
    <text x="282" y="31" class="shape">→</text>
    <rect x="318" y="7" width="112" height="46" rx="5" class="operand-a"/>
    <rect x="462" y="7" width="112" height="46" rx="5" class="operand-b"/>
    <rect x="537" y="14" width="27" height="32" rx="4" class="synthetic"/>
    <text x="341" y="31" class="core a">M</text><text x="367" y="31" class="core a">×</text><text x="397" y="31" class="core k">K</text>
    <text x="446" y="31" class="role" text-anchor="middle">@</text>
    <text x="489" y="31" class="core k">K</text><text x="518" y="31" class="core b">×</text><text x="550" y="31" class="core b">1</text>
    <text x="606" y="31" class="output">C[M]</text>
  </g>
  <line x1="20" y1="276" x2="700" y2="276" class="rule"/>

  <g transform="translate(0 282)">
    <text x="20" y="31" class="role">GEMM</text>
    <text x="112" y="31" class="shape">M×K @ K×N</text>
    <text x="282" y="31" class="shape">→</text>
    <rect x="318" y="7" width="112" height="46" rx="5" class="operand-a"/>
    <rect x="462" y="7" width="112" height="46" rx="5" class="operand-b"/>
    <text x="341" y="31" class="core a">M</text><text x="367" y="31" class="core a">×</text><text x="397" y="31" class="core k">K</text>
    <text x="446" y="31" class="role" text-anchor="middle">@</text>
    <text x="489" y="31" class="core k">K</text><text x="518" y="31" class="core b">×</text><text x="550" y="31" class="core b">N</text>
    <text x="606" y="31" class="output">C[M,N]</text>
  </g>
  <line x1="20" y1="342" x2="700" y2="342" class="rule"/>

  <rect x="318" y="368" width="27" height="32" rx="4" class="synthetic"/>
  <text x="331.5" y="390" class="shape" text-anchor="middle">1</text>
  <text x="360" y="390" class="column">synthetic axis</text>
</svg>
