<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Broadcast reuse and a negative-stride contraction</title>
  <desc id="desc">For a reversed A view broadcast across two B matrices, batch coordinate one keeps A at base zero and moves B to base twelve. Output C at batch one row two column one reads A offsets eight, seven, six, five and B offsets thirteen, sixteen, nineteen, twenty-two.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 18px; font-weight: 600; fill: #334155; }
    .mono-a { font-family: Consolas, monospace; font-size: 19px; font-weight: 700; fill: #1d4ed8; }
    .mono-b { font-family: Consolas, monospace; font-size: 19px; font-weight: 700; fill: #c2410c; }
    .mono-c { font-family: Consolas, monospace; font-size: 19px; font-weight: 700; fill: #15803d; }
    .cell { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .rule { stroke: #cbd5e1; stroke-width: 1.5; }
    .guide { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .walk-a { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
    .walk-b { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#arrow-orange); }
  </style>

  <rect width="960" height="580" fill="#ffffff"/>
  <text x="28" y="40" class="heading">broadcast reuse + reverse address walk</text>

  <rect x="28" y="66" width="432" height="70" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="46" y="94" class="mono-a">A view  (1,4,4)</text>
  <text x="46" y="121" class="mono">batch map (0)   core strides (4,-1)</text>
  <rect x="488" y="66" width="444" height="70" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="506" y="94" class="mono-b">B  (2,4,3)</text>
  <text x="506" y="121" class="mono">batch map (12)  core strides (3,1)</text>

  <text x="28" y="178" class="section">1  Batch coordinate b=1</text>
  <text x="28" y="211" class="mono-a">A base = 1*0 = 0</text>
  <text x="275" y="211" class="label">same reversed matrix</text>
  <text x="532" y="211" class="mono-b">B base = 1*12 = 12</text>
  <text x="784" y="211" class="mono-c">C base = 12</text>
  <path d="M202 221 V244 H226" class="guide"/>
  <path d="M708 221 V244 H615" class="guide"/>

  <text x="28" y="278" class="section">2  Core coordinate (i,j)=(2,1)</text>
  <rect x="28" y="296" width="280" height="52" rx="5" fill="#eff6ff"/>
  <rect x="340" y="296" width="280" height="52" rx="5" fill="#fff7ed"/>
  <rect x="652" y="296" width="280" height="52" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="46" y="329" class="mono-a">A row: 0 + 2*4 = 8</text>
  <text x="358" y="329" class="mono-b">B col: 12 + 1 = 13</text>
  <text x="670" y="329" class="mono-c">C[1,2,1] = C[19]</text>

  <text x="28" y="394" class="section">3  K contraction</text>
  <text x="28" y="427" class="label">A offsets move backward because lhs_inner_stride = -1</text>

  <rect x="68" y="451" width="76" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="144" y="451" width="76" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="220" y="451" width="76" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="296" y="451" width="76" height="54" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="106" y="478" class="cell" fill="#1d4ed8">5</text>
  <text x="182" y="478" class="cell" fill="#1d4ed8">6</text>
  <text x="258" y="478" class="cell" fill="#1d4ed8">7</text>
  <text x="334" y="478" class="cell" fill="#1d4ed8">8</text>
  <path d="M334 523 H106" class="walk-a"/>
  <text x="174" y="552" class="mono-a">8 -> 7 -> 6 -> 5</text>

  <rect x="494" y="451" width="76" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="570" y="451" width="76" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="646" y="451" width="76" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="722" y="451" width="76" height="54" fill="#ffedd5" stroke="#fb923c"/>
  <text x="532" y="478" class="cell" fill="#c2410c">13</text>
  <text x="608" y="478" class="cell" fill="#c2410c">16</text>
  <text x="684" y="478" class="cell" fill="#c2410c">19</text>
  <text x="760" y="478" class="cell" fill="#c2410c">22</text>
  <path d="M532 523 H760" class="walk-b"/>
  <text x="548" y="552" class="mono-b">13 -> 16 -> 19 -> 22</text>
</svg>
