<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">One output cell formed from one lhs row and one rhs column</title>
  <desc id="desc">The highlighted row of A and column of B traverse the shared K axis with signed inner strides to produce C i j.</desc>
  <defs>
    <marker id="arrow-k" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 28px; font-weight: 700; fill: #172033; }
    .matrix-label { font-family: Consolas; font-size: 24px; font-weight: 700; }
    .cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .cell-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .cell-b { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .cell-c { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; }
    .cell-text { font-family: Consolas; font-size: 19px; font-weight: 600; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .axis { font-family: Consolas; font-size: 20px; font-weight: 700; fill: #7c3aed; text-anchor: middle; }
    .mono { font-family: Consolas; font-size: 22px; font-weight: 600; fill: #334155; }
    .formula { font-family: Consolas; font-size: 27px; font-weight: 700; fill: #334155; text-anchor: middle; }
    .a { fill: #2563eb; }
    .b { fill: #ea580c; }
    .c { fill: #16a34a; }
    .k { fill: #7c3aed; }
    .k-path { fill: none; stroke: #7c3aed; stroke-width: 3; }
  </style>

  <rect width="720" height="440" fill="#ffffff"/>
  <text x="20" y="34" class="heading">row i × column j → C[i,j]</text>

  <text x="28" y="72" class="matrix-label a">A [M,K]</text>
  <text x="334" y="76" class="matrix-label b">B [K,N]</text>
  <text x="616" y="113" class="matrix-label c">C[i,j]</text>

  <text x="57.5" y="91" class="axis">0</text><text x="112.5" y="91" class="axis">1</text>
  <text x="167.5" y="91" class="axis">2</text><text x="222.5" y="91" class="axis">3</text>
  <g transform="translate(30 98)">
    <rect x="0" y="0" width="55" height="46" class="cell"/><rect x="55" y="0" width="55" height="46" class="cell"/><rect x="110" y="0" width="55" height="46" class="cell"/><rect x="165" y="0" width="55" height="46" class="cell"/>
    <rect x="0" y="46" width="55" height="46" class="cell-a"/><rect x="55" y="46" width="55" height="46" class="cell-a"/><rect x="110" y="46" width="55" height="46" class="cell-a"/><rect x="165" y="46" width="55" height="46" class="cell-a"/>
    <rect x="0" y="92" width="55" height="46" class="cell"/><rect x="55" y="92" width="55" height="46" class="cell"/><rect x="110" y="92" width="55" height="46" class="cell"/><rect x="165" y="92" width="55" height="46" class="cell"/>
    <text x="27.5" y="23" class="cell-text">a00</text><text x="82.5" y="23" class="cell-text">a01</text><text x="137.5" y="23" class="cell-text">a02</text><text x="192.5" y="23" class="cell-text">a03</text>
    <text x="27.5" y="69" class="cell-text a">a10</text><text x="82.5" y="69" class="cell-text a">a11</text><text x="137.5" y="69" class="cell-text a">a12</text><text x="192.5" y="69" class="cell-text a">a13</text>
    <text x="27.5" y="115" class="cell-text">a20</text><text x="82.5" y="115" class="cell-text">a21</text><text x="137.5" y="115" class="cell-text">a22</text><text x="192.5" y="115" class="cell-text">a23</text>
  </g>
  <text x="14" y="173" class="axis a">i</text>

  <text x="319" y="115" class="axis">0</text><text x="319" y="161" class="axis">1</text>
  <text x="319" y="207" class="axis">2</text><text x="319" y="253" class="axis">3</text>
  <g transform="translate(334 86)">
    <rect x="0" y="0" width="55" height="46" class="cell"/><rect x="55" y="0" width="55" height="46" class="cell"/><rect x="110" y="0" width="55" height="46" class="cell-b"/>
    <rect x="0" y="46" width="55" height="46" class="cell"/><rect x="55" y="46" width="55" height="46" class="cell"/><rect x="110" y="46" width="55" height="46" class="cell-b"/>
    <rect x="0" y="92" width="55" height="46" class="cell"/><rect x="55" y="92" width="55" height="46" class="cell"/><rect x="110" y="92" width="55" height="46" class="cell-b"/>
    <rect x="0" y="138" width="55" height="46" class="cell"/><rect x="55" y="138" width="55" height="46" class="cell"/><rect x="110" y="138" width="55" height="46" class="cell-b"/>
    <text x="27.5" y="23" class="cell-text">b00</text><text x="82.5" y="23" class="cell-text">b01</text><text x="137.5" y="23" class="cell-text b">b02</text>
    <text x="27.5" y="69" class="cell-text">b10</text><text x="82.5" y="69" class="cell-text">b11</text><text x="137.5" y="69" class="cell-text b">b12</text>
    <text x="27.5" y="115" class="cell-text">b20</text><text x="82.5" y="115" class="cell-text">b21</text><text x="137.5" y="115" class="cell-text b">b22</text>
    <text x="27.5" y="161" class="cell-text">b30</text><text x="82.5" y="161" class="cell-text">b31</text><text x="137.5" y="161" class="cell-text b">b32</text>
  </g>
  <text x="471.5" y="77" class="axis b">j</text>

  <text x="286" y="176" class="matrix-label" text-anchor="middle">@</text>
  <text x="557" y="176" class="matrix-label" text-anchor="middle">→</text>
  <rect x="616" y="142" width="72" height="58" rx="5" class="cell-c"/>
  <text x="652" y="171" class="cell-text c">c12</text>

  <path d="M50 254 H232" class="k-path" marker-end="url(#arrow-k)"/>
  <text x="30" y="286" class="mono"><tspan class="a">lhs offset</tspan><tspan> += </tspan><tspan class="k">sA_K</tspan></text>
  <path d="M519 106 V264" class="k-path" marker-end="url(#arrow-k)"/>
  <text x="334" y="298" class="mono"><tspan class="b">rhs offset</tspan><tspan> += </tspan><tspan class="k">sB_K</tspan></text>

  <line x1="20" y1="320" x2="700" y2="320" stroke="#dbe3ee" stroke-width="1.5"/>
  <text x="360" y="357" class="mono k" text-anchor="middle">k = 0 … K−1</text>
  <text x="360" y="403" class="formula"><tspan class="c">C[i,j]</tspan><tspan> = Σ</tspan><tspan class="k">ₖ</tspan><tspan> </tspan><tspan class="a">A[i,k]</tspan><tspan> </tspan><tspan class="b">B[k,j]</tspan></text>
</svg>
