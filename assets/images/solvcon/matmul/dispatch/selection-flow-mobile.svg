<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc">
  <title id="title">Mobile matmul dispatch selection flow</title>
  <desc id="desc">Operation facts test direct BLAS, then packing. Generic, direct BLAS, or pack-once BLAS converge on one fixed-kernel batch traversal.</desc>
  <defs>
    <marker id="arrow-select-mobile" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 29px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 23px; font-weight: 700; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .label { font-family: Arial; font-size: 20px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 19px; font-weight: 600; fill: #334155; }
    .facts { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .decision { fill: #fff; stroke: #7c3aed; stroke-width: 2.5; }
    .generic { fill: #f8fafc; stroke: #475569; stroke-width: 2.5; }
    .blas { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .pack { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .execute { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-select-mobile); }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .yes { font-family: Arial; font-size: 20px; font-weight: 700; fill: #16a34a; }
    .no { font-family: Arial; font-size: 20px; font-weight: 700; fill: #dc2626; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
  </style>

  <rect width="640" height="1020" fill="#ffffff"/>
  <text x="24" y="42" class="heading">select once; keep one kernel</text>

  <rect x="24" y="70" width="592" height="104" rx="8" class="facts"/>
  <text x="320" y="100" class="section">operation facts</text>
  <text x="320" y="135" class="mono" text-anchor="middle">role · dtype · M/N/K · core strides</text>
  <text x="320" y="160" class="mono" text-anchor="middle">batch size · reuse</text>

  <path d="M320 176 V208" class="arrow"/>
  <path d="M320 210 L560 280 L320 350 L80 280 Z" class="decision"/>
  <text x="320" y="266" class="section">direct BLAS eligible?</text>
  <text x="320" y="300" class="label" text-anchor="middle">compatible view + role threshold</text>

  <path d="M560 280 H628 V736 H475 V744" class="arrow"/>
  <text x="570" y="260" class="yes">yes</text>

  <path d="M320 352 V390" class="arrow"/>
  <text x="340" y="378" class="no">no</text>
  <path d="M320 392 L550 457 L320 522 L90 457 Z" class="decision"/>
  <text x="320" y="445" class="section">packing eligible?</text>
  <text x="320" y="479" class="label" text-anchor="middle">reused operand + workload policy</text>

  <path d="M320 524 V598" class="arrow"/>
  <text x="340" y="558" class="yes">yes</text>
  <path d="M90 457 H44 V604" class="arrow"/>
  <text x="54" y="438" class="no">no</text>

  <rect x="24" y="614" width="272" height="88" rx="8" class="generic"/>
  <text x="160" y="658" class="section">fixed Generic kernel</text>

  <rect x="320" y="598" width="296" height="120" rx="8" class="pack"/>
  <text x="468" y="629" class="section">pack once</text>
  <text x="468" y="664" class="mono" text-anchor="middle">row-major · replan</text>
  <text x="468" y="696" class="mono" text-anchor="middle">fixed BLAS kernel</text>

  <rect x="334" y="746" width="282" height="86" rx="8" class="blas"/>
  <text x="475" y="777" class="section">direct path</text>
  <text x="475" y="810" class="mono" text-anchor="middle">fixed BLAS kernel</text>

  <path d="M160 704 V860 H320" class="connector"/>
  <path d="M468 720 H626 V860 H320" class="connector"/>
  <path d="M475 834 V860 H320" class="connector"/>
  <path d="M320 860 V916" class="arrow"/>
  <text x="342" y="894" class="label">selection ends</text>

  <rect x="54" y="924" width="532" height="72" rx="8" class="execute"/>
  <text x="320" y="949" class="section">each batch coordinate</text>
  <text x="320" y="979" class="mono" text-anchor="middle">fixed execute_at&lt;Kernel&gt;</text>
</svg>
