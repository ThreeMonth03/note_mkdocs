<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Pack-once cost ledger for a reused reversed matrix</title>
  <desc id="desc">For the float64 size 32 benchmark in pull request 1256, the parent runs ten generic contractions directly from one reversed matrix. Pack once copies its 8 KiB payload to row-major storage once, then runs ten BLAS contractions. Runtime falls from 0.215773 to 0.010001 milliseconds, 2.44 times faster than NumPy.</desc>
  <defs>
    <marker id="arrow-ledger" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Consolas, monospace; font-size: 18px; font-weight: 500; fill: #475569; }
    .column { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
    .row-label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.3px; fill: #64748b; }
    .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #334155; }
    .small { font-family: Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #64748b; }
    .mono { font-family: Consolas, monospace; font-size: 18px; font-weight: 600; fill: #334155; }
    .metric { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; }
    .ratio { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
    .divider { stroke: #94a3b8; stroke-width: 2; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow-ledger); }
    .generic { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .blas { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .packed { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
  </style>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="32" y="38" class="title">One reversed matrix is used ten times</text>
  <text x="32" y="67" class="subtitle">float64 · S=32 · lhs (1,32,32) · strides (1024,32,-1) · PR #1256</text>

  <line x1="32" y1="89" x2="928" y2="89" class="divider"/>
  <line x1="166" y1="89" x2="166" y2="447" class="rule"/>
  <line x1="547" y1="89" x2="547" y2="447" class="divider"/>
  <text x="183" y="119" class="column">Parent: generic from original strides</text>
  <text x="564" y="119" class="column">After: pack once, then BLAS</text>

  <line x1="32" y1="137" x2="928" y2="137" class="rule"/>
  <line x1="32" y1="216" x2="928" y2="216" class="rule"/>
  <line x1="32" y1="300" x2="928" y2="300" class="rule"/>
  <line x1="32" y1="384" x2="928" y2="384" class="rule"/>
  <line x1="32" y1="447" x2="928" y2="447" class="divider"/>

  <text x="43" y="179" class="row-label">INPUT</text>
  <text x="43" y="262" class="row-label">SETUP</text>
  <text x="43" y="346" class="row-label">BATCH LOOP</text>
  <text x="43" y="422" class="row-label">RUNTIME</text>

  <rect x="187" y="153" width="78" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M200 153V201 M213 153V201 M226 153V201 M239 153V201 M252 153V201 M187 165H265 M187 177H265 M187 189H265" fill="none" stroke="#93c5fd" stroke-width="1"/>
  <path d="M252 190 H199" class="arrow"/>
  <path d="M199 190 L207 185 V195 Z" fill="#64748b"/>
  <text x="280" y="173" class="label">same strided LHS</text>
  <text x="280" y="195" class="mono">last stride = -1</text>

  <rect x="568" y="153" width="78" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M581 153V201 M594 153V201 M607 153V201 M620 153V201 M633 153V201 M568 165H646 M568 177H646 M568 189H646" fill="none" stroke="#93c5fd" stroke-width="1"/>
  <path d="M633 190 H580" class="arrow"/>
  <path d="M580 190 L588 185 V195 Z" fill="#64748b"/>
  <text x="661" y="173" class="label">same strided LHS</text>
  <text x="661" y="195" class="mono">reused by 10 products</text>

  <text x="187" y="251" class="label">No materialization</text>
  <text x="187" y="276" class="small">generic reads the original negative stride</text>

  <rect x="568" y="231" width="120" height="51" rx="4" class="packed"/>
  <text x="628" y="253" class="label" text-anchor="middle">one copy</text>
  <text x="628" y="275" class="mono" text-anchor="middle">8 KiB</text>
  <path d="M696 256 H705" class="arrow"/>
  <rect x="712" y="231" width="202" height="51" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="813" y="253" class="label" text-anchor="middle">row-major LHS</text>
  <text x="813" y="275" class="mono" text-anchor="middle">stride (1024,32,1)</text>

  <g transform="translate(187 319)">
    <rect x="0" y="0" width="23" height="42" rx="3" class="generic"/>
    <rect x="29" y="0" width="23" height="42" rx="3" class="generic"/>
    <rect x="58" y="0" width="23" height="42" rx="3" class="generic"/>
    <rect x="87" y="0" width="23" height="42" rx="3" class="generic"/>
    <rect x="116" y="0" width="23" height="42" rx="3" class="generic"/>
    <text x="154" y="28" class="column" fill="#dc2626">… x10 generic</text>
  </g>

  <g transform="translate(568 319)">
    <rect x="0" y="0" width="23" height="42" rx="3" class="blas"/>
    <rect x="29" y="0" width="23" height="42" rx="3" class="blas"/>
    <rect x="58" y="0" width="23" height="42" rx="3" class="blas"/>
    <rect x="87" y="0" width="23" height="42" rx="3" class="blas"/>
    <rect x="116" y="0" width="23" height="42" rx="3" class="blas"/>
    <text x="154" y="28" class="column" fill="#16a34a">… x10 BLAS</text>
  </g>

  <text x="187" y="426" class="metric" fill="#dc2626">0.215773 ms</text>
  <text x="568" y="426" class="metric" fill="#16a34a">0.010001 ms</text>
  <text x="885" y="425" class="ratio" fill="#16a34a" text-anchor="end">21.6x</text>

  <text x="32" y="481" class="row-label">NUMPY</text>
  <text x="187" y="483" class="metric" fill="#2563eb">0.024410 ms</text>
  <path d="M367 476 H543" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="568" y="483" class="ratio" fill="#16a34a">pack-once is 2.44x faster</text>

  <text x="32" y="526" class="label">The copied bytes are paid once; the ten contractions reuse the packed matrix.</text>
  <text x="928" y="548" class="small" text-anchor="end">macOS arm64 · NumPy 2.5.1 · Accelerate · 1 thread</text>
</svg>
