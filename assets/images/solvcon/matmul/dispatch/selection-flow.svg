<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">Matmul route selection occurs once before batch traversal</title>
  <desc id="desc">Operation facts first test direct BLAS eligibility, then packing eligibility. The selected generic or BLAS kernel stays fixed while the batch cursor advances.</desc>
  <defs>
    <marker id="arrow-select" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 28px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 19px; font-weight: 700; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .label { font-family: Arial; font-size: 17px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 17px; font-weight: 600; fill: #334155; }
    .facts { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .decision { fill: #fff; stroke: #7c3aed; stroke-width: 2.5; }
    .generic { fill: #f8fafc; stroke: #475569; stroke-width: 2.5; }
    .blas { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .pack { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .execute { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-select); }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .yes { font-family: Arial; font-size: 17px; font-weight: 700; fill: #16a34a; }
    .no { font-family: Arial; font-size: 17px; font-weight: 700; fill: #dc2626; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
  </style>

  <rect width="720" height="700" fill="#ffffff"/>
  <text x="20" y="38" class="heading">select once; traverse with a fixed kernel</text>

  <rect x="55" y="64" width="610" height="72" rx="8" class="facts"/>
  <text x="360" y="87" class="section">operation facts</text>
  <text x="360" y="117" class="mono" text-anchor="middle">role · dtype · M/N/K · core strides · batch size · reuse</text>

  <path d="M360 138 V174" class="arrow"/>
  <path d="M360 176 L515 228 L360 280 L205 228 Z" class="decision"/>
  <text x="360" y="218" class="section">direct BLAS eligible?</text>
  <text x="360" y="245" class="label" text-anchor="middle">role-specific view + threshold</text>

  <path d="M515 228 H595 V443" class="arrow"/>
  <text x="540" y="215" class="yes">yes</text>

  <path d="M360 282 V314" class="arrow"/>
  <text x="376" y="303" class="no">no</text>
  <path d="M360 312 L525 365 L360 418 L195 365 Z" class="decision"/>
  <text x="360" y="355" class="section">packing eligible?</text>
  <text x="360" y="381" class="label" text-anchor="middle">reused operand + policy</text>

  <path d="M360 420 V443" class="arrow"/>
  <text x="376" y="437" class="yes">yes</text>
  <path d="M195 365 H125 V453" class="arrow"/>
  <text x="158" y="352" class="no">no</text>

  <rect x="25" y="463" width="200" height="68" rx="8" class="generic"/>
  <text x="125" y="497" class="section">fixed Generic kernel</text>

  <rect x="265" y="453" width="190" height="88" rx="8" class="pack"/>
  <text x="360" y="476" class="section">pack once</text>
  <text x="360" y="504" class="mono" text-anchor="middle">row-major · replan</text>
  <text x="360" y="528" class="mono" text-anchor="middle">fixed BLAS kernel</text>

  <rect x="490" y="453" width="210" height="78" rx="8" class="blas"/>
  <text x="595" y="478" class="section">fixed BLAS kernel</text>
  <text x="595" y="508" class="mono" text-anchor="middle">four BLAS roles</text>

  <line x1="30" y1="570" x2="690" y2="570" class="rule"/>
  <text x="360" y="595" class="label" text-anchor="middle">selection ends here</text>

  <path d="M125 533 V618 H360" class="connector"/>
  <path d="M360 543 V618" class="connector"/>
  <path d="M595 533 V618 H360" class="connector"/>
  <path d="M360 618 V635" class="arrow"/>
  <rect x="90" y="645" width="540" height="42" rx="8" class="execute"/>
  <text x="360" y="666" class="section">each batch coordinate → fixed execute_at&lt;Kernel&gt;</text>
</svg>
