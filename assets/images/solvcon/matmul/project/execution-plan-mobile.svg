<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mobile execution plan for one batched matmul</title>
  <desc id="desc">Two broadcast operands become one GEMM plan, one selected route, and a two-by-five grid of fixed-kernel contractions.</desc>
  <defs>
    <marker id="arrow-plan-mobile" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 29px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 23px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial; font-size: 20px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 21px; font-weight: 600; fill: #334155; }
    .mono-small { font-family: Consolas; font-size: 18px; font-weight: 600; fill: #334155; }
    .cell { font-family: Consolas; font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .a { fill: #2563eb; }
    .b { fill: #ea580c; }
    .c { fill: #16a34a; }
    .a-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .b-box { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .plan-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .route-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .grid { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-plan-mobile); }
  </style>

  <rect width="640" height="1000" fill="#ffffff"/>
  <text x="24" y="42" class="heading">one @ → one plan → ten contractions</text>

  <rect x="24" y="70" width="592" height="84" rx="8" class="a-box"/>
  <text x="46" y="102" class="section a">A</text>
  <text x="88" y="102" class="mono">shape (2,1,3,4)</text>
  <text x="88" y="134" class="mono">strides (12,12,4,1)</text>

  <rect x="24" y="174" width="592" height="84" rx="8" class="b-box"/>
  <text x="46" y="206" class="section b">B</text>
  <text x="88" y="206" class="mono">shape (1,5,4,6)</text>
  <text x="88" y="238" class="mono">strides (120,24,6,1)</text>

  <path d="M320 260 V294" class="arrow"/>
  <text x="342" y="282" class="label">normalize once</text>

  <rect x="24" y="304" width="592" height="276" rx="8" class="plan-box"/>
  <text x="46" y="338" class="section">execution plan</text>
  <line x1="46" y1="350" x2="594" y2="350" class="rule"/>
  <text x="46" y="384" class="label">role / core</text>
  <text x="242" y="384" class="mono">GEMM · M=3 · N=6 · K=4</text>
  <text x="46" y="424" class="label">batch</text>
  <text x="242" y="424" class="mono">domain (2,5)</text>
  <text x="46" y="464" class="label">mappings</text>
  <text x="242" y="464" class="mono-small">out(90,18) · A(12,0)</text>
  <text x="242" y="493" class="mono-small">B(0,24)</text>
  <text x="46" y="529" class="label">core strides</text>
  <text x="242" y="529" class="mono-small">A(4,1) · B(6,1)</text>
  <text x="46" y="563" class="label">output</text>
  <text x="242" y="563" class="mono c">shape (2,5,3,6)</text>

  <path d="M320 582 V614" class="arrow"/>
  <rect x="24" y="624" width="592" height="104" rx="8" class="route-box"/>
  <text x="46" y="656" class="section">select once before batch traversal</text>
  <text x="46" y="690" class="mono">Generic · direct BLAS</text>
  <text x="46" y="716" class="mono">pack once + fixed BLAS</text>

  <path d="M320 730 V760" class="arrow"/>
  <text x="24" y="790" class="section">batch cursor (2,5)</text>
  <text x="616" y="790" class="label" text-anchor="end">one fixed kernel</text>

  <g transform="translate(44 812)">
    <g transform="translate(0 0)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B0</tspan></text></g>
    <g transform="translate(110 0)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B1</tspan></text></g>
    <g transform="translate(220 0)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B2</tspan></text></g>
    <g transform="translate(330 0)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B3</tspan></text></g>
    <g transform="translate(440 0)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B4</tspan></text></g>
    <g transform="translate(0 54)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B0</tspan></text></g>
    <g transform="translate(110 54)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B1</tspan></text></g>
    <g transform="translate(220 54)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B2</tspan></text></g>
    <g transform="translate(330 54)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B3</tspan></text></g>
    <g transform="translate(440 54)"><rect width="110" height="54" class="grid"/><text x="55" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B4</tspan></text></g>
  </g>

  <text x="44" y="950" class="mono-small a">A0/A1 reused ×5</text>
  <text x="594" y="950" class="mono-small b" text-anchor="end">B0…B4 reused ×2</text>
</svg>
