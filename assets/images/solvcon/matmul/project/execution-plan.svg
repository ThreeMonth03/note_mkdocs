<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">One batched matmul normalized into a plan and ten contractions</title>
  <desc id="desc">Operands A two by one by three by four and B one by five by four by six become one GEMM plan, one selected route, and a two by five grid of contractions.</desc>
  <defs>
    <marker id="arrow-plan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .heading { font-family: Arial; font-size: 28px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 22px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial; font-size: 18px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 19px; font-weight: 600; fill: #334155; }
    .mono-small { font-family: Consolas; font-size: 17px; font-weight: 600; fill: #334155; }
    .cell { font-family: Consolas; font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .a { fill: #2563eb; }
    .b { fill: #ea580c; }
    .c { fill: #16a34a; }
    .a-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .b-box { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .plan-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .route-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .grid { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-plan); }
  </style>

  <rect width="720" height="760" fill="#ffffff"/>
  <text x="20" y="38" class="heading">one @ → one plan → ten contractions</text>

  <rect x="20" y="66" width="290" height="70" rx="7" class="a-box"/>
  <text x="38" y="92" class="section a">A</text>
  <text x="73" y="92" class="mono">shape (2,1,3,4)</text>
  <text x="73" y="119" class="mono-small">strides (12,12,4,1)</text>

  <rect x="410" y="66" width="290" height="70" rx="7" class="b-box"/>
  <text x="428" y="92" class="section b">B</text>
  <text x="463" y="92" class="mono">shape (1,5,4,6)</text>
  <text x="463" y="119" class="mono-small">strides (120,24,6,1)</text>

  <path d="M165 142 V174 H300" class="arrow"/>
  <path d="M555 142 V174 H420" class="arrow"/>
  <text x="360" y="164" class="label" text-anchor="middle">normalize once</text>

  <rect x="90" y="184" width="540" height="218" rx="8" class="plan-box"/>
  <text x="112" y="214" class="section">execution plan</text>
  <line x1="112" y1="226" x2="608" y2="226" class="rule"/>
  <text x="112" y="254" class="label">role / core</text>
  <text x="302" y="254" class="mono">GEMM · M=3 · N=6 · K=4</text>
  <text x="112" y="286" class="label">batch domain</text>
  <text x="302" y="286" class="mono">(2,5)</text>
  <text x="112" y="318" class="label">batch mappings</text>
  <text x="302" y="318" class="mono-small">out(90,18) · A(12,0) · B(0,24)</text>
  <text x="112" y="350" class="label">core strides</text>
  <text x="302" y="350" class="mono-small">A(row,K)=(4,1) · B(K,col)=(6,1)</text>
  <text x="112" y="382" class="label">output</text>
  <text x="302" y="382" class="mono c">shape (2,5,3,6)</text>

  <path d="M360 404 V438" class="arrow"/>
  <rect x="90" y="448" width="540" height="82" rx="8" class="route-box"/>
  <text x="112" y="474" class="label">select once before batch traversal</text>
  <text x="112" y="502" class="mono">Generic · direct BLAS</text>
  <text x="112" y="524" class="mono">pack once + fixed BLAS</text>

  <path d="M360 532 V558" class="arrow"/>
  <text x="20" y="580" class="section">batch cursor: (2,5)</text>
  <text x="700" y="580" class="label" text-anchor="end">fixed kernel at every coordinate</text>

  <g transform="translate(55 600)">
    <g transform="translate(0 0)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B0</tspan></text></g>
    <g transform="translate(122 0)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B1</tspan></text></g>
    <g transform="translate(244 0)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B2</tspan></text></g>
    <g transform="translate(366 0)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B3</tspan></text></g>
    <g transform="translate(488 0)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A0</tspan><tspan> @ </tspan><tspan class="b">B4</tspan></text></g>
    <g transform="translate(0 54)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B0</tspan></text></g>
    <g transform="translate(122 54)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B1</tspan></text></g>
    <g transform="translate(244 54)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B2</tspan></text></g>
    <g transform="translate(366 54)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B3</tspan></text></g>
    <g transform="translate(488 54)"><rect width="122" height="54" class="grid"/><text x="61" y="27" class="cell"><tspan class="a">A1</tspan><tspan> @ </tspan><tspan class="b">B4</tspan></text></g>
  </g>

  <text x="55" y="736" class="mono-small a">A0/A1 reused five times</text>
  <text x="665" y="736" class="mono-small b" text-anchor="end">B0…B4 reused twice</text>
</svg>
