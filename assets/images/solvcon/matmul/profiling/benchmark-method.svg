<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">PR 1256 benchmark measurement trace</title>
  <desc id="desc">Each method gets one discarded preconditioning run, followed by six balanced method orders. Each method in each round uses two untimed warm-up batches and fifteen calibrated timed batches. Ninety per-call estimates per method are reduced with an untrimmed median.</desc>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Consolas, monospace; font-size: 18px; font-weight: 500; fill: #475569; }
    .heading { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #172033; }
    .body { font-family: Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #334155; }
    .mono { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; fill: #172033; }
    .round { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; fill: #64748b; }
    .token { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .track { stroke: #cbd5e1; stroke-width: 2; }
    .connector { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
    .numpy { fill: #2563eb; }
    .before { fill: #dc2626; }
    .after { fill: #16a34a; }
    .warm { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.5; }
    .timed { fill: #7c3aed; }
    .result { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
    .audit { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
    .discard { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="38" y="41" class="title">How one benchmark number is made</text>
  <text x="38" y="72" class="subtitle">PR #1256 · same workload · balanced order · median of raw timings</text>

  <rect x="38" y="94" width="245" height="58" rx="5" class="panel"/>
  <text x="55" y="119" class="heading">Same inputs</text>
  <text x="55" y="142" class="body">N, B, and A</text>
  <path d="M283 123 H318" class="connector"/>
  <rect x="327" y="94" width="272" height="58" rx="5" class="discard"/>
  <text x="344" y="119" class="heading">Preconditioning</text>
  <text x="344" y="142" class="body">once per method, discard</text>
  <path d="M599 123 H634" class="connector"/>
  <rect x="643" y="94" width="279" height="58" rx="5" class="panel"/>
  <text x="660" y="119" class="heading">Formal run</text>
  <text x="660" y="142" class="body">six balanced rounds</text>

  <text x="38" y="188" class="heading">Execution order</text>
  <g transform="translate(38 207)">
    <text x="0" y="22" class="round">R1</text><line x1="46" y1="16" x2="432" y2="16" class="track"/>
    <rect x="54" y="0" width="116" height="32" rx="4" class="numpy"/><text x="112" y="23" class="token">N</text>
    <rect x="184" y="0" width="116" height="32" rx="4" class="before"/><text x="242" y="23" class="token">B</text>
    <rect x="314" y="0" width="116" height="32" rx="4" class="after"/><text x="372" y="23" class="token">A</text>

    <text x="0" y="61" class="round">R2</text><line x1="46" y1="55" x2="432" y2="55" class="track"/>
    <rect x="54" y="39" width="116" height="32" rx="4" class="numpy"/><text x="112" y="62" class="token">N</text>
    <rect x="184" y="39" width="116" height="32" rx="4" class="after"/><text x="242" y="62" class="token">A</text>
    <rect x="314" y="39" width="116" height="32" rx="4" class="before"/><text x="372" y="62" class="token">B</text>

    <text x="0" y="100" class="round">R3</text><line x1="46" y1="94" x2="432" y2="94" class="track"/>
    <rect x="54" y="78" width="116" height="32" rx="4" class="before"/><text x="112" y="101" class="token">B</text>
    <rect x="184" y="78" width="116" height="32" rx="4" class="numpy"/><text x="242" y="101" class="token">N</text>
    <rect x="314" y="78" width="116" height="32" rx="4" class="after"/><text x="372" y="101" class="token">A</text>

    <text x="0" y="139" class="round">R4</text><line x1="46" y1="133" x2="432" y2="133" class="track"/>
    <rect x="54" y="117" width="116" height="32" rx="4" class="before"/><text x="112" y="140" class="token">B</text>
    <rect x="184" y="117" width="116" height="32" rx="4" class="after"/><text x="242" y="140" class="token">A</text>
    <rect x="314" y="117" width="116" height="32" rx="4" class="numpy"/><text x="372" y="140" class="token">N</text>

    <text x="0" y="178" class="round">R5</text><line x1="46" y1="172" x2="432" y2="172" class="track"/>
    <rect x="54" y="156" width="116" height="32" rx="4" class="after"/><text x="112" y="179" class="token">A</text>
    <rect x="184" y="156" width="116" height="32" rx="4" class="numpy"/><text x="242" y="179" class="token">N</text>
    <rect x="314" y="156" width="116" height="32" rx="4" class="before"/><text x="372" y="179" class="token">B</text>

    <text x="0" y="217" class="round">R6</text><line x1="46" y1="211" x2="432" y2="211" class="track"/>
    <rect x="54" y="195" width="116" height="32" rx="4" class="after"/><text x="112" y="218" class="token">A</text>
    <rect x="184" y="195" width="116" height="32" rx="4" class="before"/><text x="242" y="218" class="token">B</text>
    <rect x="314" y="195" width="116" height="32" rx="4" class="numpy"/><text x="372" y="218" class="token">N</text>
  </g>

  <g transform="translate(500 207)">
    <text x="0" y="22" class="heading">Inside every N, B, or A token</text>
    <text x="0" y="57" class="body">Calibrate n → about 30 ms per batch</text>

    <text x="0" y="105" class="mono">untimed warm-up ×2</text>
    <rect x="230" y="82" width="31" height="31" rx="4" class="warm"/>
    <rect x="270" y="82" width="31" height="31" rx="4" class="warm"/>

    <text x="0" y="153" class="mono">timed ×15</text>
    <g transform="translate(132 127)">
      <rect x="0" y="0" width="17" height="31" rx="2" class="timed"/><rect x="22" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="44" y="0" width="17" height="31" rx="2" class="timed"/><rect x="66" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="88" y="0" width="17" height="31" rx="2" class="timed"/><rect x="110" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="132" y="0" width="17" height="31" rx="2" class="timed"/><rect x="154" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="176" y="0" width="17" height="31" rx="2" class="timed"/><rect x="198" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="220" y="0" width="17" height="31" rx="2" class="timed"/><rect x="242" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="264" y="0" width="17" height="31" rx="2" class="timed"/><rect x="286" y="0" width="17" height="31" rx="2" class="timed"/>
      <rect x="308" y="0" width="17" height="31" rx="2" class="timed"/>
    </g>
    <text x="0" y="190" class="body">one estimate = elapsed ÷ n calls</text>

    <rect x="0" y="214" width="422" height="76" rx="5" class="result"/>
    <text x="18" y="244" class="heading">6 rounds × 15 = 90 per method</text>
    <text x="18" y="273" class="body">Report the untrimmed median.</text>
  </g>

  <g transform="translate(38 465)">
    <rect x="0" y="0" width="18" height="18" rx="2" class="numpy"/><text x="27" y="16" class="body">N NumPy</text>
    <rect x="140" y="0" width="18" height="18" rx="2" class="before"/><text x="167" y="16" class="body">B parent</text>
    <rect x="278" y="0" width="18" height="18" rx="2" class="after"/><text x="305" y="16" class="body">A PR #1256</text>
  </g>

  <rect x="38" y="516" width="884" height="74" rx="5" class="audit"/>
  <text x="56" y="544" class="heading">Audit: 96 workloads × 3 methods × 6 rounds = 1,728 JSONL records</text>
  <text x="56" y="574" class="body">Orders, loop counts, timings, shapes, strides, and errors are preserved.</text>
  <text x="902" y="574" class="mono" text-anchor="end">rel. Frobenius 1.32e-16</text>
</svg>
