<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">PR 1256 benchmark measurement trace</title>
  <desc id="desc">Each method gets one discarded preconditioning run, followed by six balanced method orders. Each method in each round uses two untimed warm-up batches and fifteen calibrated timed batches. Ninety per-call estimates per method are reduced with an untrimmed median.</desc>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
    .subtitle { font-family: Consolas, monospace; font-size: 22px; font-weight: 500; fill: #475569; }
    .heading { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #172033; }
    .body { font-family: Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #334155; }
    .mono { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #172033; }
    .round { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #64748b; }
    .token { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.7; }
    .track { stroke: #cbd5e1; stroke-width: 2; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .numpy { fill: #2563eb; }
    .before { fill: #dc2626; }
    .after { fill: #16a34a; }
    .warm { fill: #ffffff; stroke: #7c3aed; stroke-width: 3; }
    .timed { fill: #7c3aed; }
    .result { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .audit { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.7; }
    .discard { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="640" height="1080" fill="#ffffff"/>
  <text x="28" y="41" class="title">How one number is made</text>
  <text x="28" y="74" class="subtitle">PR #1256 benchmark trace</text>

  <rect x="28" y="98" width="178" height="74" rx="5" class="panel"/>
  <text x="45" y="127" class="heading">Same inputs</text>
  <text x="45" y="157" class="body">N · B · A</text>
  <path d="M206 135 H226" class="connector"/>
  <rect x="235" y="98" width="195" height="74" rx="5" class="discard"/>
  <text x="251" y="127" class="heading">Precondition</text>
  <text x="251" y="157" class="body">each method</text>
  <path d="M430 135 H450" class="connector"/>
  <rect x="459" y="98" width="153" height="74" rx="5" class="panel"/>
  <text x="475" y="127" class="heading">Formal</text>
  <text x="475" y="157" class="body">6 rounds</text>

  <text x="28" y="215" class="heading">Balanced execution order</text>
  <g transform="translate(28 238)">
    <text x="0" y="27" class="round">R1</text><line x1="52" y1="20" x2="580" y2="20" class="track"/>
    <rect x="62" y="0" width="158" height="40" rx="4" class="numpy"/><text x="141" y="29" class="token">N</text>
    <rect x="237" y="0" width="158" height="40" rx="4" class="before"/><text x="316" y="29" class="token">B</text>
    <rect x="412" y="0" width="158" height="40" rx="4" class="after"/><text x="491" y="29" class="token">A</text>

    <text x="0" y="75" class="round">R2</text><line x1="52" y1="68" x2="580" y2="68" class="track"/>
    <rect x="62" y="48" width="158" height="40" rx="4" class="numpy"/><text x="141" y="77" class="token">N</text>
    <rect x="237" y="48" width="158" height="40" rx="4" class="after"/><text x="316" y="77" class="token">A</text>
    <rect x="412" y="48" width="158" height="40" rx="4" class="before"/><text x="491" y="77" class="token">B</text>

    <text x="0" y="123" class="round">R3</text><line x1="52" y1="116" x2="580" y2="116" class="track"/>
    <rect x="62" y="96" width="158" height="40" rx="4" class="before"/><text x="141" y="125" class="token">B</text>
    <rect x="237" y="96" width="158" height="40" rx="4" class="numpy"/><text x="316" y="125" class="token">N</text>
    <rect x="412" y="96" width="158" height="40" rx="4" class="after"/><text x="491" y="125" class="token">A</text>

    <text x="0" y="171" class="round">R4</text><line x1="52" y1="164" x2="580" y2="164" class="track"/>
    <rect x="62" y="144" width="158" height="40" rx="4" class="before"/><text x="141" y="173" class="token">B</text>
    <rect x="237" y="144" width="158" height="40" rx="4" class="after"/><text x="316" y="173" class="token">A</text>
    <rect x="412" y="144" width="158" height="40" rx="4" class="numpy"/><text x="491" y="173" class="token">N</text>

    <text x="0" y="219" class="round">R5</text><line x1="52" y1="212" x2="580" y2="212" class="track"/>
    <rect x="62" y="192" width="158" height="40" rx="4" class="after"/><text x="141" y="221" class="token">A</text>
    <rect x="237" y="192" width="158" height="40" rx="4" class="numpy"/><text x="316" y="221" class="token">N</text>
    <rect x="412" y="192" width="158" height="40" rx="4" class="before"/><text x="491" y="221" class="token">B</text>

    <text x="0" y="267" class="round">R6</text><line x1="52" y1="260" x2="580" y2="260" class="track"/>
    <rect x="62" y="240" width="158" height="40" rx="4" class="after"/><text x="141" y="269" class="token">A</text>
    <rect x="237" y="240" width="158" height="40" rx="4" class="before"/><text x="316" y="269" class="token">B</text>
    <rect x="412" y="240" width="158" height="40" rx="4" class="numpy"/><text x="491" y="269" class="token">N</text>
  </g>

  <g transform="translate(28 532)">
    <rect x="0" y="0" width="22" height="22" rx="3" class="numpy"/><text x="31" y="20" class="body">N NumPy</text>
    <rect x="190" y="0" width="22" height="22" rx="3" class="before"/><text x="221" y="20" class="body">B parent</text>
    <rect x="387" y="0" width="22" height="22" rx="3" class="after"/><text x="418" y="20" class="body">A PR #1256</text>
  </g>

  <text x="28" y="603" class="heading">Inside every N, B, or A</text>
  <text x="28" y="638" class="body">Calibrate n → about 30 ms per timed batch</text>
  <text x="28" y="688" class="mono">untimed warm-up ×2</text>
  <rect x="305" y="660" width="38" height="38" rx="4" class="warm"/>
  <rect x="354" y="660" width="38" height="38" rx="4" class="warm"/>
  <text x="28" y="747" class="mono">timed ×15</text>
  <g transform="translate(225 714)">
    <rect x="0" y="0" width="20" height="38" rx="2" class="timed"/><rect x="25" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="50" y="0" width="20" height="38" rx="2" class="timed"/><rect x="75" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="100" y="0" width="20" height="38" rx="2" class="timed"/><rect x="125" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="150" y="0" width="20" height="38" rx="2" class="timed"/><rect x="175" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="200" y="0" width="20" height="38" rx="2" class="timed"/><rect x="225" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="250" y="0" width="20" height="38" rx="2" class="timed"/><rect x="275" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="300" y="0" width="20" height="38" rx="2" class="timed"/><rect x="325" y="0" width="20" height="38" rx="2" class="timed"/>
    <rect x="350" y="0" width="20" height="38" rx="2" class="timed"/>
  </g>
  <text x="205" y="785" class="body">estimate = elapsed ÷ n calls</text>

  <rect x="28" y="817" width="584" height="92" rx="5" class="result"/>
  <text x="46" y="850" class="heading">6 × 15 = 90 estimates per method</text>
  <text x="46" y="885" class="body">Report the untrimmed median.</text>

  <rect x="28" y="935" width="584" height="117" rx="5" class="audit"/>
  <text x="46" y="968" class="heading">Audit trail</text>
  <text x="46" y="1003" class="mono">96 × 3 × 6 = 1,728 JSONL</text>
  <text x="46" y="1037" class="body">max rel. Frobenius error 1.32e-16</text>
</svg>
