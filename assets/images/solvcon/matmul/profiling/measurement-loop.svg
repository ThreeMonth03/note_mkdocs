<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Warm up, collect repeated timings, and compare medians</title>
  <desc id="desc">Inputs are prepared outside the timer. Every round discards warmup calls, records NumPy then solvcon single-call samples, and contributes to two pooled distributions whose medians form a ratio.</desc>
  <style>
    .heading { font-family: Arial; font-size: 30px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 21px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial; font-size: 18px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 18px; font-weight: 600; fill: #334155; }
    .mono-strong { font-family: Consolas; font-size: 20px; font-weight: 700; fill: #172033; }
    .setup { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .warm { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
    .sample { fill: #fff; stroke: #64748b; stroke-width: 2; }
    .np { fill: #2563eb; }
    .sc { fill: #ea580c; }
    .discard { fill: #fff; stroke: #94a3b8; stroke-width: 3; }
    .median { stroke: #16a34a; stroke-width: 6; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
  </style>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="24" y="42" class="heading">warm up → collect R×S per method → compare medians</text>

  <rect x="24" y="70" width="912" height="66" rx="8" class="setup"/>
  <text x="44" y="97" class="section">setup outside the probe</text>
  <text x="44" y="121" class="mono">generate operands · construct SimpleArray views · same dtype, shape, layout</text>

  <text x="24" y="174" class="section">each round</text>
  <rect x="24" y="190" width="310" height="132" rx="8" class="warm"/>
  <text x="44" y="218" class="section">warm-up × W</text>
  <text x="44" y="245" class="label">executed, not recorded</text>
  <circle cx="105" cy="283" r="16" class="discard"/>
  <text x="105" y="289" class="mono np" text-anchor="middle">NP</text>
  <text x="158" y="289" class="mono-strong" text-anchor="middle">→</text>
  <circle cx="211" cy="283" r="16" class="discard"/>
  <text x="211" y="289" class="mono sc" text-anchor="middle">SC</text>
  <text x="267" y="289" class="label" text-anchor="middle">discard</text>

  <rect x="354" y="190" width="582" height="132" rx="8" class="sample"/>
  <text x="374" y="218" class="section">samples × S</text>
  <text x="374" y="245" class="label">one probe encloses one public API call</text>
  <circle cx="405" cy="283" r="16" class="np"/>
  <text x="405" y="289" class="mono" fill="#fff" text-anchor="middle">NP</text>
  <text x="430" y="289" class="mono-strong">→ record tN</text>
  <text x="583" y="289" class="mono-strong">then</text>
  <circle cx="655" cy="283" r="16" class="sc"/>
  <text x="655" y="289" class="mono" fill="#fff" text-anchor="middle">SC</text>
  <text x="680" y="289" class="mono-strong">→ record tS</text>
  <text x="917" y="289" class="label" text-anchor="end">fixed order</text>

  <text x="480" y="350" class="mono" text-anchor="middle">repeat the same round R times</text>
  <line x1="24" y1="372" x2="936" y2="372" class="rule"/>

  <text x="24" y="406" class="section">pooled timings</text>
  <text x="24" y="448" class="mono-strong np">NumPy</text>
  <line x1="135" y1="442" x2="680" y2="442" class="axis"/>
  <circle cx="206" cy="442" r="8" class="np"/><circle cx="242" cy="442" r="8" class="np"/>
  <circle cx="267" cy="442" r="8" class="np"/><circle cx="292" cy="442" r="8" class="np"/>
  <circle cx="330" cy="442" r="8" class="np"/><circle cx="617" cy="442" r="8" class="np"/>
  <line x1="280" y1="423" x2="280" y2="461" class="median"/>
  <text x="702" y="448" class="mono">median → T_numpy</text>

  <text x="24" y="510" class="mono-strong sc">solvcon</text>
  <line x1="135" y1="504" x2="680" y2="504" class="axis"/>
  <circle cx="174" cy="504" r="8" class="sc"/><circle cx="205" cy="504" r="8" class="sc"/>
  <circle cx="226" cy="504" r="8" class="sc"/><circle cx="253" cy="504" r="8" class="sc"/>
  <circle cx="287" cy="504" r="8" class="sc"/><circle cx="572" cy="504" r="8" class="sc"/>
  <line x1="239" y1="485" x2="239" y2="523" class="median"/>
  <text x="702" y="510" class="mono">median → T_solvcon</text>

  <text x="135" y="546" class="label">elapsed time →</text>
  <text x="680" y="546" class="label" text-anchor="end">occasional slow call</text>

  <line x1="24" y1="570" x2="936" y2="570" class="rule"/>
  <text x="480" y="610" class="mono-strong" text-anchor="middle">ratio = T_solvcon / T_numpy</text>
  <text x="480" y="640" class="section" text-anchor="middle" fill="#16a34a">ratio &lt; 1 means solvcon is faster for this workload</text>
</svg>
