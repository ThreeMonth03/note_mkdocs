<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" role="img" aria-labelledby="title desc">
  <title id="title">Mobile view of the matmul profiling loop</title>
  <desc id="desc">Setup is outside timing, each round discards warmups and records NumPy followed by solvcon samples, and pooled medians form the comparison ratio.</desc>
  <style>
    .heading { font-family: Arial; font-size: 29px; font-weight: 700; fill: #172033; }
    .section { font-family: Arial; font-size: 22px; font-weight: 700; fill: #172033; }
    .label { font-family: Arial; font-size: 19px; font-weight: 600; fill: #475569; }
    .mono { font-family: Consolas; font-size: 19px; font-weight: 600; fill: #334155; }
    .mono-strong { font-family: Consolas; font-size: 21px; font-weight: 700; fill: #172033; }
    .setup { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .warm { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
    .sample { fill: #fff; stroke: #64748b; stroke-width: 2; }
    .np { fill: #2563eb; }
    .sc { fill: #ea580c; }
    .discard { fill: #fff; stroke: #94a3b8; stroke-width: 3; }
    .median { stroke: #16a34a; stroke-width: 6; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .rule { stroke: #dbe3ee; stroke-width: 1.5; }
  </style>

  <rect width="640" height="980" fill="#ffffff"/>
  <text x="24" y="42" class="heading">warm up → sample → median</text>

  <rect x="24" y="70" width="592" height="90" rx="8" class="setup"/>
  <text x="44" y="100" class="section">setup outside the probe</text>
  <text x="44" y="130" class="mono">operands · SimpleArray views</text>

  <text x="24" y="202" class="section">each round</text>
  <rect x="24" y="220" width="592" height="126" rx="8" class="warm"/>
  <text x="44" y="250" class="section">warm-up × W</text>
  <circle cx="198" cy="307" r="18" class="discard"/>
  <text x="198" y="314" class="mono np" text-anchor="middle">NP</text>
  <text x="266" y="314" class="mono-strong" text-anchor="middle">→</text>
  <circle cx="334" cy="307" r="18" class="discard"/>
  <text x="334" y="314" class="mono sc" text-anchor="middle">SC</text>
  <text x="452" y="314" class="label" text-anchor="middle">not recorded</text>

  <rect x="24" y="366" width="592" height="172" rx="8" class="sample"/>
  <text x="44" y="398" class="section">samples × S</text>
  <text x="44" y="430" class="label">one probe = one public API call</text>
  <circle cx="92" cy="480" r="18" class="np"/>
  <text x="92" y="487" class="mono" fill="#fff" text-anchor="middle">NP</text>
  <text x="126" y="487" class="mono">→ record tN</text>
  <text x="300" y="487" class="mono">then</text>
  <circle cx="378" cy="480" r="18" class="sc"/>
  <text x="378" y="487" class="mono" fill="#fff" text-anchor="middle">SC</text>
  <text x="412" y="487" class="mono">→ record tS</text>
  <text x="320" y="522" class="label" text-anchor="middle">fixed NumPy → solvcon order</text>

  <text x="320" y="575" class="mono" text-anchor="middle">repeat R rounds → R×S timings per method</text>
  <line x1="24" y1="600" x2="616" y2="600" class="rule"/>

  <text x="24" y="638" class="section">pooled timings</text>
  <text x="24" y="684" class="mono-strong np">NumPy</text>
  <line x1="148" y1="678" x2="582" y2="678" class="axis"/>
  <circle cx="205" cy="678" r="8" class="np"/><circle cx="237" cy="678" r="8" class="np"/>
  <circle cx="266" cy="678" r="8" class="np"/><circle cx="294" cy="678" r="8" class="np"/>
  <circle cx="325" cy="678" r="8" class="np"/><circle cx="550" cy="678" r="8" class="np"/>
  <line x1="280" y1="659" x2="280" y2="697" class="median"/>

  <text x="24" y="750" class="mono-strong sc">solvcon</text>
  <line x1="148" y1="744" x2="582" y2="744" class="axis"/>
  <circle cx="178" cy="744" r="8" class="sc"/><circle cx="207" cy="744" r="8" class="sc"/>
  <circle cx="232" cy="744" r="8" class="sc"/><circle cx="260" cy="744" r="8" class="sc"/>
  <circle cx="292" cy="744" r="8" class="sc"/><circle cx="522" cy="744" r="8" class="sc"/>
  <line x1="246" y1="725" x2="246" y2="763" class="median"/>

  <text x="148" y="792" class="label">elapsed time →</text>
  <text x="582" y="792" class="label" text-anchor="end">green = median</text>
  <line x1="24" y1="820" x2="616" y2="820" class="rule"/>

  <text x="320" y="866" class="mono-strong" text-anchor="middle">ratio = median(SC) / median(NP)</text>
  <text x="320" y="906" class="section" text-anchor="middle" fill="#16a34a">ratio &lt; 1 → solvcon faster</text>
  <text x="320" y="950" class="label" text-anchor="middle">schematic measurement flow, not benchmark data</text>
</svg>
